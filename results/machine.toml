# The one line of a run block that a process may get wrong, kept where a
# person can correct it.
#
# What a run detects on this platform is already the chip, the OS build
# and the architecture -- `platform.processor()` alone answers `arm`, so
# the chip comes from sysctl and the build from sw_vers. Elsewhere it is
# whatever `platform` will say, which is less. This file is how a run on
# somebody else's hardware names whose, and it overrides the detected
# line whenever it is present.
machine = "Apple M5, macOS 26.6 (build 25G72), arm64"
