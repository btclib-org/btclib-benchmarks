[build-system]
# what a distribution carries is glob patterns in the
# [tool.uv.build-backend] table below, beside the rest of the
# configuration, in place of the separate include and exclude language
# of a MANIFEST.in.
#
# The pin is btclib's, inherited with its reason. Under 0.12 the sdist
# carries this file verbatim, comments and all, and no second copy of
# it: built with uv_build==0.11.31 there is no pyproject.toml.orig in
# the archive. From 0.12.0 on the member is a normalized copy with the
# verbatim one beside it under that name, so a floor below the minor
# would leave what the sdist holds with two answers. The ceiling is the
# next minor, which is where uv's versioning policy puts a breaking
# change, this backend releasing with uv and versioned by it. That a
# pure-Python project of this organization uses this backend at all is
# btclib-org/.github#118
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "btclib-benchmarks"
# the one place the version is declared, and docs/source/conf.py parses
# this file rather than the installed metadata, which would need the
# package installed to build the documentation
version = "2026.9"
description = "Benchmarks of btclib and btclib_secp256k1 against their comparands"
readme = "README.md"
# PEP 639: a SPDX expression and the files it refers to, replacing the
# deprecated license table and the License :: classifier. COPYRIGHT is
# not among them: LICENSE carries the holder for whoever has the archive,
# and the notice's source text is a repository file, named under
# [tool.check-sdist] below
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
authors = [{ name = "The btclib developers", email = "devs@btclib.org" }]
requires-python = ">=3.11"
# the comparands are dependencies here, where in btclib and
# btclib_secp256k1 they were a `bench` dependency group -- and that
# inversion is the whole reason this repository exists. There they were
# third-party packages resolved into the lock of a library that does not
# import them, so a Dependabot alert against one of them was an alert
# against btclib; the four open ones (GHSA-wj6h-64fc-37mp on `ecdsa`,
# two on `cbor2`, one on `protobuf`, the last three of them transitive
# through `hwi`) were every one of them a comparand of a benchmark
# nothing in the library ran. Here they are what the project is for, so
# an alert against one names the package it is actually about.
#
# GHSA-wj6h-64fc-37mp against `ecdsa` is exactly that: a Minerva timing
# side channel upstream ships no patched release for and does not plan
# one, `ecdsa` offering no constant-time execution at all. Dismissed as
# a tolerable risk rather than left open: `ecdsa` is imported only by
# this project's own timing harness, on every run, and never to protect
# anything, so the alert has nothing to wait on.
#
# A floor and not a pin, for the reason btclib's `bench` group gave and
# this inherits: the premise of the comparison is whatever `pip install`
# currently gives a user, so a new release is to be picked up and
# measured rather than refused. Each floor records the release the
# numbers in the tables were taken against.
#
# `btclib` and `btclib_secp256k1` are comparands too, at their published
# releases and not a checkout: `pip install btclib` is what an end user
# gets, and that is the only performance an end user has. Measuring a
# working tree instead is a different question, and scripts/README.md
# says how to ask it without making it the default.
dependencies = [
    # `grind=` on dsa.sign_ and the `_libsecp256k1_available` switch --
    # btclib's private *dispatch*, which these scripts reach into -- shipped
    # in 2026.8.21. The floor named "2026.9" before that release existed, a
    # placeholder for whichever one carried them; the actual release is
    # numbered lower than the guess, PEP 440 comparing (2026, 8, 21) below
    # (2026, 9). [tool.uv.sources] stood in for it with the branch, and now
    # that it is out the source entry is gone and this floor is the whole
    # of the pin
    "btclib>=2026.8.21",
    # `ssa.Signer` and the parsed-key entry points these rows call
    # shipped in 0.8.0.3 -- the floor named the release before it
    # existed, [tool.uv.sources] stood in for it below, and now that it
    # is out the source entry is gone and this floor is the whole of the
    # pin
    "btclib-secp256k1>=0.8.0.3",
    "buidl>=0.2.36",
    "coincurve>=21.0.0",
    "ecdsa>=0.19.2",
    # the closest comparand btclib_secp256k1 has, and the one that costs
    # something to install: PyPI carries no wheel, only the sdist, so
    # `uv sync` compiles the libsecp256k1 carried in it as a submodule.
    # That is the same toolchain `coincurve` and `secp256k1` already ask
    # for here, and it is what makes the row honest -- the binary timed
    # is that build rather than whatever system library was findable.
    # Unlike those two it builds a `py3-none-<platform>` wheel, the C
    # being reached through ctypes and not linked into an extension, so
    # it is indifferent to the interpreter and holds no part of the 3.13
    # ceiling below
    "electrum-ecc>=0.0.7",
    "embit>=0.8.0",
    "pycoin>=0.92718.20260405",
    "python-bitcoinlib>=0.12.2",
    "secp256k1>=0.14.0",
    # on no index at all, so [tool.uv.sources] below takes it from its
    # git tag. It declares >=3.11, and that is where this project's own
    # floor comes from: scripts/04-pure-python.py imports it unguarded,
    # so on 3.10 the module cannot be loaded at all. A benchmark that
    # will not start says more than one with a row silently missing, so
    # the floor moved instead of the import growing a guard
    "secp256k1lab",
]
keywords = [
    "bitcoin",
    "benchmark",
    "cryptography",
    "elliptic-curves",
    "secp256k1",
    "ecdsa",
    "schnorr",
    "bip340",
    "bip32",
    "libsecp256k1",
    "performance",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    # `src/btclib_benchmarks/py.typed` ships in the wheel: section 3 of
    # the organization standard asks that this classifier and that
    # marker agree, one being PEP 561's promise to an installer and the
    # other the same promise on the index page
    "Typing :: Typed",
]

[project.urls]
# the organization site, this tree publishing no documentation of its
# own -- REPOSITORY.md's *What is not configured, and why* has both
# halves, under "No Read the Docs" and "No GitHub Pages". Section 3 of
# the organization standard asks a releasing tree's homepage to be its
# own documentation site and asks nothing of a tree that releases
# nothing, which leaves a choice between the site of the organization
# whose libraries these benchmarks time and this repository -- and the
# second is what `repository` below carries and what a reader following
# the *About* link is already looking at
homepage = "https://btclib.org"
download = "https://github.com/btclib-org/btclib-benchmarks/releases"
repository = "https://github.com/btclib-org/btclib-benchmarks"
issues = "https://github.com/btclib-org/btclib-benchmarks/issues"
pull_requests = "https://github.com/btclib-org/btclib-benchmarks/pulls"

[dependency-groups]
test = ["coverage", "pytest", "pytest-cov", "pytest-randomly"]
lint = ["mypy", "pre-commit", "ruff>=0.16"]
# what inspects the distribution before it would be published -- and here
# nothing is published, so this is a lint of the packaging. Named `check`,
# not `build`, the name section 1 of btclib-org/.github keeps for the tools
# that build a distribution, a frontend and the wheel repairers, which
# btclib-secp256k1 holds under it beside a `check` like this one
check = ["check-sdist", "pyroma", "twine"]
docs = ["furo", "myst-parser", "sphinx"]
# what the mutation workflow and a local session both run against;
# .github/mutation/*.toml is the scope and CONTRIBUTING.md's own section
# on it is the recipe, so this group is the one thing cosmic-ray needs
# to be installed at all
mutation = ["cosmic-ray"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "check" },
    { include-group = "docs" },
    { include-group = "mutation" },
]

[tool.uv]
# the oldest uv that may read uv.lock -- section 1 has the argument and
# section 15 the command that measures the ceiling
required-version = ">=0.12.7"

[tool.uv.sources]
# the one comparand with no release on any index, pinned to the tag its
# own pyproject.toml calls 1.0.0
secp256k1lab = { git = "https://github.com/secp256k1lab/secp256k1lab", tag = "v1.0.0" }

[tool.uv.build-backend]
# no key here, so the backend takes `project.name` normalized under its
# default `src/` root -- `src/btclib_benchmarks/` exactly -- and that is
# what the wheel ships: the four modules the benchmarks and the suite
# both import, `_inputs.py`, `_provenance.py`, `_results.py` and
# `_vectors.py`. The six numbered scripts, `artifacts.py` and
# `render.py` are not part of it and stay under `scripts/`: a module
# whose name opens with a digit or carries a hyphen is not a Python
# identifier, so none of them could enter a package as they are, and the
# reading order the numbering gives is deliberate. They stay run by
# path, which is what `uv run` in README.md does for them; what
# installing the package now buys is that `from btclib_benchmarks
# import _inputs` resolves for the scripts and the suite that import it,
# where the removed key's empty wheel left nothing on `sys.path` for
# either to find.
# what the sdist carries beyond what the backend puts there by itself --
# pyproject.toml, PKG-INFO, and the files `project.readme` and
# `project.license-files` name. Patterns are anchored, so `*.md` is the
# root's own markdown and reaches neither the pages under results/ nor
# the vendored vectors' README, and `/**` is what recurses.
#
# The sdist is not how this project is used -- the scripts are run from
# a checkout -- but it is what check-sdist, pyroma and twine inspect,
# and a distribution that omits the thing it is named after would pass
# none of them. So the benchmarks, the suite, the vendored vectors and
# the runs the README links to ship, and the repository furniture that
# means nothing outside a checkout does not: the hook configuration, the
# editor and agent workspaces and the workflows are named by no pattern
# here, and [tool.check-sdist] git-only below is where that absence is
# declared.
#
# vectors/ and results/ are taken whole rather than by suffix:
# WYCHEPROOF_COPYING is the licence of one of the vendored vectors and
# has no extension to list, and a run writes its page and its JSON in
# one command, so a suffix list is a way for one of a pair to go missing
source-include = [
    "*.md",
    ".python-version",
    "uv.lock",
    "docs/**",
    "results/**",
    "scripts/**",
    "src/**",
    "tests/**",
    "vectors/**",
]
# exclusions win over the inclusions above, and are unanchored unless a
# pattern starts with "/": a bare name matches at any depth, and
# everything below a match goes with it.
#
# check-sdist reads this list for the uv backend, so a tracked file a
# pattern here takes out is not reported as one the sdist is missing,
# and does not have to be named again in [tool.check-sdist] below
source-exclude = [
    # where CONTRIBUTING.md's documentation gate writes, under a
    # directory `docs/**` otherwise sweeps whole: with the gate's output
    # in place the sdist carries none of it
    "/docs/build",
    # a cache a linter or type checker writes beside the file it has
    # just checked. The ones the gates here write land at the root,
    # which no pattern above reaches; these answer the copy that lands
    # under a directory taken whole -- planted under tests/ and
    # scripts/, neither reaches the sdist. __pycache__, *.pyc and *.pyo
    # are the backend's own default excludes, and are not repeated here
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    # the same kind of leftover, and this one is not hypothetical: the
    # check-sdist hook runs with --inject-junk, whose list plants an
    # egg-info under tests/ for the length of the run, where `tests/**`
    # would otherwise ship it
    "*.egg-info",
]

[tool.check-sdist]
# tracked files the sdist is meant not to carry. What
# [tool.uv.build-backend] source-exclude names is not repeated here:
# check-sdist reads that list for the uv backend, so this holds only
# what no include pattern adds in the first place -- the files the lint
# hooks read, the workspaces of an editor and of an agent, and what git
# and a documentation service read. Patterns are gitignore's, so a
# directory covers what is under it at any depth.
#
# The hook's own default ignore list carries .github and
# .pre-commit-config.yaml, so neither the workflows nor the file that
# lists the hooks is named here; it carries .readthedocs.yml, with the
# extension this tree does not use, which is why .readthedocs.yaml is.
# COPYRIGHT is the source the notice-rgx below is transcribed from, and
# a header's source is read by the gate and by nobody who installs the
# package: a repository file, so it left `license-files` and is named
# here instead (btclib-org/.github#135).
# Emptying this list and running the hook names the files these patterns
# cover and nothing besides
git-only = [
    ".claude/",
    "COPYRIGHT",
    ".gitattributes",
    ".gitignore",
    ".markdownlint.jsonc",
    ".readthedocs.yaml",
    ".secrets.baseline",
    ".taplo.toml",
    ".vscode/",
    ".yamllint.yaml",
]

[tool.pytest.ini_options]
# what the suite covers is the scripts' own helpers -- the backend
# probes, the table formatting -- and never a timing, a measurement being
# the one thing a test cannot assert. tests/README.md says which
testpaths = ["tests"]
addopts = "-ra --cov --durations=8 --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.codespell]
# `vectors/` is skipped whole, and the reason is the point of vendoring:
# those files are byte for byte the copies `vectors/README.md` publishes a
# digest for, and a spelling fix inside one is a copy that has stopped
# being the file it claims to be. Wycheproof's has `empyt` in three
# comments, which codespell corrects and the digest check then rejects --
# correctly, that being the whole job of the digest. The typo is
# upstream's to fix
skip = ".secrets.baseline,uv.lock,vectors/*"
# the PyPI package scripts/03-libraries.py compares against, which is
# a real word to codespell by way of "build". It cannot be spelled
# differently: it is the name on the index
ignore-words-list = "buidl"
ignore-regex = '`[^`]*`'

[tool.typos.files]
# `vectors/` for the reason [tool.codespell] gives above, and here it
# matters more: this hook runs with --write-changes, so an uncorrected
# vendored file is one it silently rewrites into a copy whose digest no
# longer matches the provenance published for it.
#
# This table is silent without --force-exclude in the hook's args:
# pre-commit passes filenames, and typos honours its own exclude list
# only under that flag. So the two are one setting written in two files,
# and dropping the flag does not narrow the exclusion, it removes it
extend-exclude = [".secrets.baseline", "uv.lock", "vectors/"]

[tool.typos.default]
# an unbroken run of 26 characters or more is a key, a signature or a
# hash, not a word: 26 is the length of the shortest possible base58
# address, and the trailing = covers base64 padding
extend-ignore-re = ['[0-9A-Za-z+/]{26,}={0,2}']

[tool.typos.default.extend-words]
# the PyPI package, not the "build" this hook offers to correct it to.
# The hook runs with --write-changes, so without this line it renames a
# comparand into a package that does not exist
buidl = "buidl"

[tool.typos.type.verbatim]
extend-glob = ["CHANGELOG.md", ".pre-commit-config.yaml"]
extend-ignore-re = ['`[^`]*`']

[tool.coverage.run]
# `src/btclib_benchmarks/` and the suite, and deliberately not the six
# benchmark scripts under `scripts/` beside them. What their bodies do is
# time things: covering a timing function means running it, so a coverage
# gate over them would make every test run a benchmark -- slow, and
# worse, it would put a measurement inside CI, where the numbers mean
# nothing. What *is* testable in them is reached the other way round, by
# importing the module: the `main()` guard exists so that an import runs
# the fixtures and the cross-comparand assertions without timing anything,
# and tests/scripts_import_test.py is what does it. So the scripts are
# checked on the one property a test can hold them to -- that they load,
# that their comparands agree -- and measured by a person.
#
# `src/btclib_benchmarks/`'s four modules are measured in full: they are
# exactly the modules the suite already imports and asserts against, and
# living under a package changes where they are and not what covers them
# -- `_results.py` is the one of the four still omitted below, for its
# own reason
source = ["scripts", "src", "tests"]
# what is measured here is mostly parsing and provenance, and both are
# written as a walk with an early exit: statement coverage calls a loop
# fully covered once its body has run, and never asks whether the loop
# ever ended without finding what it looked for. That missing exit is
# the shape a wrong default hides in, so the gate is over branches too
branch = true
# the six benchmarks themselves. Naming them here rather than leaving
# them to fail the gate is the same decision as the `source` comment
# above, said in the form coverage understands: measured by a person, and
# checked by a test only on whether they load.
#
# `_results.py` and `render.py` are here for a different reason, and it is
# a decision rather than an oversight. Publishing a page is deliberately
# not coupled to the suite: a run is saved as data and rendered back into
# markdown by a command a person runs, and the whole value of that is that
# it needs neither a machine nor a test run. A gate over them would put
# the rewording of a heading behind the suite, which is the coupling this
# split removes. What holds them honest instead is that they
# are the *only* writer of those blocks -- `render.py --check` says
# whether a page still matches the run it claims to publish, and a page
# nobody can edit by hand cannot drift from its numbers
omit = [
    "*/site-packages/*",
    "src/btclib_benchmarks/_results.py",
    "scripts/03-libraries.py",
    "scripts/02-btclib-vs-btclib.py",
    "scripts/05-key-reuse.py",
    "scripts/01-libsecp256k1.py",
    "scripts/04-pure-python.py",
    "scripts/06-silentpayments.py",
    "scripts/render.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# 100 is not the same rule with the bar raised: coverage special-cases
# it, so nothing short of an exact 100.00% passes. What is measured here
# is the helpers, not the timing loops -- those carry `pragma: no cover`
# with the reason beside them, a benchmark's own measurement being
# something a test must not run
fail_under = 100.0

[tool.mypy]
strict = true
show_column_numbers = true
# the organization's list, section 6 of btclib-org/.github, the same in
# every repository that runs mypy (btclib-org/.github#165). A code that
# finds nothing here stays: it is a ratchet for the next line it would
# catch, not a cleanup of this one
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
warn_unreachable = true
# the oldest interpreter this project supports, which `requires-python`
# above sets from a comparand. Aimed at the floor rather than at whatever
# runs it, a typing construct missing from it is a type error here
# instead of a runtime failure on the matrix
python_version = "3.11"
exclude = ["build"]
# `scripts` is for the eight files still reached by path -- the six
# numbered benchmarks, `artifacts.py` and `render.py`, not part of the
# installed `btclib_benchmarks` package: the same `sys.path` entry
# tests/conftest.py makes for them, said to the type checker.
#
# `src` is for a different reason: `--explicit-package-bases` below draws
# its package roots from `mypy_path` (and `MYPYPATH`), not from the
# directories named on the mypy command line, so without it mypy opens
# `src/btclib_benchmarks` under two names at once and refuses to proceed:
# `src.btclib_benchmarks`, from the bare directory named on the command
# line, and `btclib_benchmarks`, from the editable install's own `.pth`
# pointing at that same directory -- `_results.py` importing its own package
# sibling included. Naming `src` here is what tells mypy the two are one
# package, not two.
mypy_path = ["scripts", "src"]

# the comparands below ship no py.typed and no stub, so the import is
# unresolved whether or not the package is installed. ignore_missing_imports
# silences exactly that; the scripts' own logic still gets strict mode, and
# only what comes back from a comparand is `Any`. btclib and
# btclib_secp256k1 are not in this list -- both ship py.typed, and a
# benchmark of them should type check against them. coincurve and
# secp256k1lab are not in it either, for the same reason: both ship
# py.typed too, so ignore_missing_imports would silence a real regression
# -- an import that later stops resolving -- rather than catch one
[[tool.mypy.overrides]]
module = [
    "bitcoin.*",
    "buidl.*",
    "ecdsa.*",
    "electrum_ecc.*",
    "embit.*",
    "pycoin.*",
    "secp256k1.*",
]
ignore_missing_imports = true

[tool.ruff]
# target-version is inferred from project.requires-python
# tests/ and docs/source/ carry no __init__.py, and INP001 below would
# otherwise read that as an oversight: tests/ is collected by pytest's
# rootdir-relative import and asks for none, and docs/source/conf.py is
# Sphinx's entry point, read by path and never imported. Declaring the
# two here is what tells the rule so, the way it is meant to be told:
# `namespace-packages` has ruff treat a directory as if it already
# carried an `__init__.py`.
#
# scripts/ is not among them, and deliberately: the same option makes
# ruff treat every file under it as a package module too, which is what
# N999 then checks the six numbered benchmarks' own names against -- and
# none of them could pass, a name opening with a digit or carrying a
# hyphen not being a Python identifier (tests/conftest.py's own docstring
# gives the reason in full). scripts/*.py's own per-file-ignores entry
# below is where that direction is answered instead
namespace-packages = ["tests", "docs/source"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
# every rule family ruff ships, present ones and a release's future ones
# alike: `ignore` below is where a family or a single rule is turned back
# off, each entry argued beside it. `ignore` holds three kinds of entry,
# told apart by what its comment argues: a rule the formatter conflicts
# with, cited from ruff's own docs/formatter.md and not argued in this
# tree's own words, since the list is the vendor's; a rule this tree
# declines on its own merits; and TD, disciplining a marker FIX refuses
# outright
select = ["ALL"]
extend-select = ["unspecified-encoding"]
ignore = [
    # every one of these is docs/formatter.md's own list, at the
    # ruff-pre-commit rev .pre-commit-config.yaml pins: enabling one
    # flags what ruff-format's own algorithm decided instead of
    # demanding, so `ruff check` and `ruff format` would fight the tree
    # they both look at. Two of the vendor's own list are not named here,
    # each for its own reason and not by omission: the pep257 convention
    # below already disables incorrect-blank-line-before-class (D203)
    # without an ignore entry doing it -- a declared convention settles
    # the pair ruff calls incompatible, so naming the half it disables
    # here would change no diagnostic and silence no warning -- and
    # multi-line-implicit-string-concatenation's (ISC002) own conflict is
    # conditional on ISC001 being off, which it is not: ISC is selected
    # whole
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    # docstrings: every public module, class, method and function must
    # carry one -- D100/D104 and the D101/D102/D103 left out of this
    # list enforce exactly that. The convention leaves these two
    # enabled -- it is not what silences them, ignoring them is -- for
    # every dunder and every constructor still to be written and not
    # only the ones already in the tree. A magic method is documented
    # by the data model it implements. `undocumented-public-init` is
    # declined for a different reason: it checks that a docstring
    # exists, never that it says anything, and the cheapest line
    # satisfying it restates what the constructor's own annotations and
    # strict mypy already carry. PEP 257 puts the constructor's
    # documentation in `__init__`'s own docstring, so declining the
    # rule declines that presence check and never the documentation --
    # an argument's meaning, a raised exception, an invariant the
    # constructor establishes still has nowhere else to go. Section 5
    # of btclib-org/.github gives the reason
    "undocumented-magic-method",
    "undocumented-public-init",
    # code length is enforced by the formatter, which reflows to its 88
    # columns everything it is allowed to rewrite. What is left for
    # line-too-long to find is what no width the formatter controls can
    # break: a benchmark row's own label describing what it measures,
    # and a guard condition naming a loaded module in a test. The prose
    # the formatter never touches is measured instead by max-doc-length
    # below. `uv run ruff check --select E501 --no-cache .` lists the
    # sites
    "line-too-long",
    # sizes and prefixes a specification assigns, not values this code
    # chose and could have named instead: a message length fixed by a
    # published test vector's own schema, and SEC's 0x04 prefix on an
    # uncompressed key. `uv run ruff check --select PLR2004 --no-cache .`
    # lists the sites, in a fixture and in the tests reading it
    "magic-value-comparison",
    # the message is built where the exception is raised because that
    # is the only place holding what went wrong -- which page, which
    # table, which schema -- and a shared exception class could not say
    # that without every raise site passing it back in anyway.
    # `uv run ruff check --select TRY003 --no-cache .` lists the sites,
    # every one in src/btclib_benchmarks/_results.py or scripts/render.py
    "raise-vanilla-args",
    # PARSERS, CHECKED_PAIRS and their siblings in tests/wrappers_test.py
    # are dispatch tables typed `Callable[[..., bool], ...]`, called
    # through the dict rather than by name -- `parse(encoding, True)`,
    # never `parse(encoding, compressed=True)`. The type carries no
    # argument names, so no call through one of these tables could pass
    # the bool a keyword: the site is the type, not any one wrapper's own
    # signature.
    # `uv run ruff check --select FBT003 --no-cache .` lists the sites,
    # every one a call through such a table
    "boolean-positional-value-in-call",
    # FIX refuses a TODO, a FIXME, an XXX or a HACK wherever one opens a
    # comment: unfinished work belongs in an issue, searchable,
    # assignable and closeable, not in a comment beside code that reads
    # as finished. TD disciplines the same four markers' format instead
    # of refusing them, and is not even a superset of what FIX catches --
    # HACK draws no TD diagnostic at all -- so a repository that finishes
    # what it starts keeps the refusal and leaves TD here
    "TD",
]

[tool.ruff.lint.per-file-ignores]
# the whole output of every one of these is the table a manual run reads,
# and each asserts its comparands agree with each other before timing any
# of them. T20 is selected for the same reason it is everywhere in this
# org -- a library writes to no stream of its own -- and a script whose
# caller is a person at a terminal is the case it is not about. SLF001 is
# what CLAUDE.md's own reasoning about `_libsecp256k1_available` already
# argues -- btclib's private dispatch switch, reached into on purpose so
# `python_arithmetic_only()` can turn it off after the row that measures
# through libsecp256k1. INP001 is `[tool.ruff]`'s own `namespace-packages`
# comment above, read the other way: this directory is not a package and
# cannot become one, the six numbered benchmarks' own names not being
# Python identifiers
"scripts/*.py" = [
    "S101",   # assert
    "T201",   # print
    "SLF001", # private member access
    "INP001", # implicit namespace package
]
# the workflow's own helper, read by `mutation.yml` and run standalone
# (`python .github/scripts/mutation_counts.py`): the same INP001 argument
# as `scripts/*.py` above, this directory not being a package either, and
# T201 for the one line worth reading in the log its own docstring names
".github/scripts/*.py" = [
    "T201",   # print
    "INP001", # implicit namespace package
]
# `_results.py` narrows a `json.loads` return with `isinstance` seven
# times over -- the type it reads back is `Any`, and this is how the
# module says what it actually holds before trusting it. The glob above
# does not reach it: this module left `scripts/`, where it carried the
# same exemption, for `src/btclib_benchmarks/` in this same change. Only
# S101, and only this file: the other three modules under
# `src/btclib_benchmarks/` have no assert or print to exempt
# (`uv run ruff check --select S101,T201 --no-cache src/`)
"src/btclib_benchmarks/_results.py" = [
    "S101", # assert
]
"tests/**" = [
    "S101",
    "B017",
    "PT011",
    "PT012",
    "PT018",
    "RUF043",
    # a fixture applied for its monkeypatching alone -- inputs_test.py's
    # `cache` chief among them -- is unread in the test body by design;
    # pytest looks a fixture up by its parameter's own name, so the usual
    # leading underscore that answers ARG001 elsewhere would also un-wire
    # the fixture
    "ARG001",
    # `_inputs.py`, `_provenance.py`, `_results.py` and `_vectors.py` are
    # themselves underscore-named -- private to the package, not merely
    # to a class inside it -- and this suite is what covers them, so a
    # test reaching `_stream`, `_read` or `_table_from_json` is exercising
    # the module directly rather than crossing into somebody else's
    # internals. vectors_test.py's one `curve._libsecp256k1_available`
    # is scripts/*.py's own SLF001 entry above, for the same reason
    "SLF001",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
# 80 columns on the prose, where the code keeps the formatter's 88:
# ruff-format reflows code and never a comment or a docstring, so 88 is
# what it can enforce and this is the rest
max-doc-length = 80

# what holds a docstring under scripts/ to the signature it sits over,
# ruff having no rule for a missing argument: pydocstyle below asks that
# a docstring exists, and this asks that what it says about the
# arguments and the return value is still true. Run as a hook, over
# scripts/ only; see the comment there for the scope
[tool.pydoclint]
# the sections the docstrings here already use, and the ones a reader of
# the source sees rendered as sections rather than as indented prose
style = "google"
# the types are in the signature, and mypy is strict: repeating them in
# the docstring is a second place to be wrong
arg-type-hints-in-docstring = false
check-return-types = false
# the tool's own default, written out because section 4 of
# btclib-org/.github leaves the value to each repository and asks for
# the reason beside it. What decides it is the form the contract takes
# here: a summary line saying what comes back -- "Return the pool's
# secret keys." -- with a paragraph under it where there is more to
# say. pydoclint reads a section and not a sentence, so false asks for
# a Returns section under a summary that already states the return,
# which writes it a second time in the same docstring. What is left
# checked is the drift the hook is for: a docstring that does document
# its arguments, held against the signature it claims to describe. The
# strict setting's findings are issue 128, listed there rather than
# here so that flipping this is a decision made with the list in front
# of it
skip-checking-short-docstrings = true

# and this one is off, deliberately. It compares the Raises section with
# the `raise` statements of the body, and what these helpers raise comes
# mostly from what they call -- a comparand's parser, json, bytes.fromhex
# -- so what a caller catches is not what the body raises. Kept on, it
# would force each docstring to document its own body instead of its
# contract, which is the opposite of what these sections are for
skip-checking-raises = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-copyright]
# COPYRIGHT is the one place the notice text is written down; this is all
# three of its lines as one regex, anchored so that the notice opens the
# file rather than merely appearing in its first 4096 bytes
notice-rgx = "^# Copyright \\(c\\) The btclib developers\\n# Distributed under the MIT software license, see the accompanying\\n# LICENSE file or https://opensource\\.org/license/mit for the full text\\."
