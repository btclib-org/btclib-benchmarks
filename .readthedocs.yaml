---
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# The dotted name is the canonical one; readthedocs.yml is honored too,
# but documented as deprecated. Neither spelling reaches the sdist:
# [tool.uv.build-backend] source-include names no yaml at all, so this
# file is out of it for not having been asked for rather than by being
# excluded, and [tool.check-sdist] git-only is where that is declared.
#
# No read the docs project is subscribed to this repository, and
# REPOSITORY.md says so under "No Read the Docs". The file is here
# because docs.yml runs what it declares: the sphinx build gates a pull
# request whether or not anything publishes the result, and a
# declaration a service would read is what keeps that command in one
# place instead of only inside a workflow step. It has to be true now
# rather than corrected on the day something subscribes.
#
# Which is why the sibling files are the wrong thing to copy from, and
# this one was a copy of btclib's, down to prose about installing btclib
# so that autodoc can import it. Nothing under docs/source carries an
# autodoc directive -- `grep -rn automodule docs/source` answers with
# nothing -- and conf.py's own docstring records why the version comes
# from pyproject.toml rather than from installed metadata.
# There is no import here for -W to turn into a build error. What -W
# catches instead is a markdown link these `{include}`-based pages get
# wrong, which is the whole of it today; -n adds sphinx's own
# cross-reference resolution -- a `:class:` or `:func:` role naming
# something that does not exist -- ahead of the day a page writes one,
# per btclib-org/.github's README.md "The documentation".

# Required
version: 2

# `.python-version`'s 3.13, not the newest CPython: docs.yml no longer pins
# an interpreter of its own -- it calls btclib-org/.github's
# reusable-docs.yml, which takes none -- so this file is the only place
# the documentation build's interpreter is chosen, and naming
# `.python-version`'s own pin here is what keeps "does the build pass" a
# single question again. Read the Docs cannot read that file directly,
# so the version is copied rather than referenced, and moves when it
# does (issue btclib-org/.github#35)
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # build.commands rather than the sphinx: and python: keys, which cannot
  # express installing a dependency group and are rejected when it is
  # present. uv installs the docs group from uv.lock, which is why there
  # is no docs/requirements.txt: the group in pyproject.toml is the
  # single declaration and the lock pins it, where a requirements file
  # would be unpinned and kept in step by a header asking a human to do
  # it.
  # uv itself is not pinned, deliberately: no dependabot ecosystem
  # watches this file, so a pin here is a version nobody bumps, and
  # --locked makes the uv version irrelevant to what gets installed --
  # uv.lock decides that, and a uv too old to read the lock fails loudly
  # rather than resolving something else.
  # --no-default-groups --group docs, not this file's former
  # --only-group docs: btclib-org/.github's reusable-docs.yml runs the
  # former unconditionally for every caller, and docs.yml now calls it,
  # so the two builds run one command rather than each answering "does
  # the build pass" on terms of its own. That installs the project and
  # its own dependencies -- coincurve and secp256k1 included -- though
  # no page under docs/source imports anything; `.python-version`'s pin
  # at 3.13 is what makes the install succeed at all, both wrappers
  # publishing a wheel for it and neither for 3.14
  # (issue btclib-org/.github#35)
  # -n turns an unresolved sphinx-domain cross-reference into a warning
  # and -W turns that warning, like every other, into an error; the
  # build fails at its end rather than at the first warning, so one
  # broken page does not hide the next
  commands:
    - pip install uv
    - uv sync --locked --no-default-groups --group docs
    - >-
      uv run --locked --no-default-groups --group docs
      sphinx-build -W -n -b html docs/source $READTHEDOCS_OUTPUT/html
