---
name: vendored vectors

# `vectors/README.md` pins every vendored file to an upstream commit and
# the git blob SHA-1 compared against it. `tests/vectors_test.py` holds
# the blob half on every run, which catches a copy edited here; the
# commit half is a question about another repository and the suite runs
# offline, so nothing in a gate can ask it. This asks it once a week, and
# opens or updates an issue on drift rather than fixing anything:
# refreshing a vector file changes what every comparand is held to, which
# is a decision the script does not get to make.
#
# The checkout, the optional interpreter setup and the re-check itself
# are btclib-org/.github's: reusable-vendored-vectors.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# its README.md). What stays here is the trigger, the cron minute, the
# concurrency group and the ledger this tree checks.
#
# issues: write here is granted by no other workflow in this tree, and
# three decline it in as many words, each for its own reason: links.yml,
# deps-latest.yml and mutation.yml. The reason this one takes it is the
# called workflow's own header, not this file's to restate.

on:
  schedule:
    # the day and the time are section 10's grid in btclib-org/.github and
    # not this file's to restate; the sibling of links.yml in what it
    # asks, that one whether a page this tree points at still resolves
    # and this one whether a file it pinned is still the file.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "16 3 * * 1"
  workflow_dispatch:
  # so a change to this file, to the script it runs or to the pins it
  # reads is checked by the thing it configures
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run this
    # pull request's own concurrency group is still holding survives
    # either unless the closed event lands in that same group -- which
    # this type is what makes it do, cancel-in-progress below turning the
    # landing into the cancellation
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/vendored-vectors.yml
      - .github/scripts/check_vendored_vectors.py
      - vectors/README.md

permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here: in a called workflow that expression is the caller's name.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by -- a closed, merged pull
# request resolves github.ref to the base branch's ref, which the
# schedule and the dispatch above also resolve to. Neither of those two
# carries pull_request context, so github.ref is still what groups either
concurrency:
  group: vendored-vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    uses: btclib-org/.github/.github/workflows/reusable-vendored-vectors.yml@main
    # permissions do not inherit through a call: the check job the
    # reusable workflow runs wants issues: write for its gh issue
    # create/edit/close calls, so the calling job declares it here,
    # which is what caps what the called workflow may be granted
    permissions:
      contents: read
      issues: write # gh issue create/edit/close, in the called workflow
    with:
      # cardinality 1: this tree pins one ledger, vectors/README.md, and
      # no tf2-verdict ledger the way btclib's own caller does
      ledgers: >-
        [{"ledger": "vectors/README.md",
        "title": "Vendored vectors behind upstream"}]
      # python-version left at its default, the empty string: this tree
      # runs the check against the runner's own python3, installing no
      # interpreter for it, same as before the conversion
