---
name: codeql

# Code scanning, as a file rather than as a repository setting. GitHub's
# default setup analyses a language set at a query suite from a workflow
# it generates and does not show; here the languages, the suite, the
# schedule and the action versions are read the way the rest of CI is
# read, with every action pinned to a commit SHA.
#
# Nothing has to be turned off first, which is the one thing to check
# before adding this file to a repository -- default setup and an
# advanced workflow are exclusive, and the collision is at the upload
# rather than at the start, so a run would build its database and then be
# refused. Asked here:
#
#     gh api repos/btclib-org/btclib-benchmarks/code-scanning/default-setup
#
# it answers `state: not-configured`, and REPOSITORY.md is where that is
# recorded with the rest of what is set outside the tree. Turning the
# setting on is what would make every analysis here red.
#
# What there is to analyse, on a repository that ships no importable
# package, is two things and they are not the same size. The workflow
# files are the larger one: this tree runs third-party build scripts on a
# runner and has just grown a set of scheduled workflows, and an
# expression interpolated into a `run:` block is the finding the actions
# queries make. The Python is the helpers under `scripts/` -- they parse
# vendored JSON and CSV, a saved run and a rendered page, which is the
# shape the python queries are about.

on:
  # push and schedule since this workflow was added, and pull_request
  # since btclib-org/.github#349: the OpenSSF Scorecard's SAST check
  # reads a pull request's own commits for a SAST tool run against them,
  # so a push-and-schedule-only trigger scored "0 commits out of N are
  # checked with a SAST tool" however many merges to main this workflow
  # had already analysed -- a finding on a branch is one its author can
  # still answer, where the same finding on main is a finding on the
  # default branch already. push stays: dropping it would leave a direct
  # push to main -- rare here, but possible -- unanalysed, and that is a
  # different question from the one btclib-org/.github#349 asks. schedule
  # stays too: a query pack updates without anybody touching the
  # repository, so the analysis of an unchanged tree is a different
  # answer this week than last.
  #
  # Gaining pull_request does not make this a required check.
  # REPOSITORY.md's "Required checks on main" does not name it, the same
  # choice claude-review.yml states for itself and for the same reason:
  # what a merge requires is a branch rule held outside this repository,
  # and btclib-org/.github#349's own "Done when" asks only that this
  # workflow run on pull_request, nothing about gating one. Whether it
  # should become required is for whoever holds admin on branch
  # protection to decide
  push:
    # a merge creates a commit that no pull request analysed under the
    # sha it lands as, and an alert is attributed to a branch: the
    # default branch is where code scanning reports what is open, so
    # without a run here there is no baseline
    branches: [main]
  pull_request:
    # the organization standard's own default set for a pull_request
    # trigger, section 10: ready_for_review because a readied pull
    # request would otherwise wait for its next push, and closed so the
    # merge lands in the pull request's own concurrency group and
    # cancels the run still holding it -- the concurrency block below is
    # what makes that landing resolve to this pull request's own group
    # rather than to the push trigger's
    types: [opened, reopened, synchronize, ready_for_review, closed]
  schedule:
    # a weekly run is what a push trigger cannot replace: a query pack
    # updates without anybody touching the repository, so the analysis of
    # an unchanged tree is a different answer this week than last.
    # The day and the time are section 10's grid in btclib-org/.github
    # and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "16 4 * * 0"
  # still worth reaching for on a branch whose pull request is not open
  # yet, which is what the actions queries read
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN, which everything running in a job
# can read. contents: read is the whole of what the workflow needs; the
# job below declares the two it needs on top of that, so the write is
# held by one job rather than by the file
permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow: in a called workflow
  # that expression is the caller's name, so two workflows called from
  # one place would share a group and cancel each other.
  # github.event.pull_request.number, not github.ref alone, is what a
  # pull_request run of any action groups by -- github.ref for a closed,
  # merged pull request resolves to the base branch's ref rather than
  # refs/pull/N/merge, which is what put docs.yml's closed run in the
  # push trigger's own group and cancelled the run building the actual
  # merge commit's documentation one to two seconds after every merge,
  # observed on this repository's own main after #99 merged. Grouping by
  # the pull request's own number here from the start is what keeps this
  # workflow from hitting the same bug the day it gets its first closed
  # event. A push carries no pull_request context, so github.ref is
  # still what groups it, unchanged
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # the language is in the name because it is what a failure is about:
    # one job per language, so a red check names which analysis broke
    # instead of a matrix cell to open. It also lets the two run at once
    name: Analyze ${{ matrix.language }} with CodeQL
    # a draft pull request is work in progress and spends no runner here
    # either; a closed one spends none either, the trigger above taking
    # the closed event only to supersede a run this pull request's own
    # group is still holding -- the same condition test.yml and docs.yml
    # carry on their own jobs. push and schedule carry no pull_request
    # context, so both sides of this read empty there and stay true
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      # where the alerts are uploaded to; the one write in this workflow
      security-events: write
      contents: read
      # what the `actions` analysis reads: the workflow files are its
      # source, and analyze queries the run's own metadata
      actions: read
    strategy:
      # so one language's failure does not hide the other's result
      fail-fast: false
      matrix:
        # what CodeQL supports of what is here. The tree is Python,
        # workflows, markdown, toml and vendored test vectors, and the
        # first two of those are the ones it has queries for
        language: [actions, python]
    # far above what an analysis of this tree needs, the same way the
    # gate bounds the suite: what it buys is that a hung job releases the
    # runner rather than holding it for six hours.
    # `gh run list --workflow=codeql.yml --limit 1` is what re-measures it
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move, and these
      # run in the one job here that can write security events
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # `none` is the only mode either language has: neither is
          # compiled, so the database is built from the sources without a
          # build. Said out loud rather than left to be inferred, since
          # the value is what an autobuild step would otherwise be needed
          # for. Nothing is installed first either, and here that is a
          # decision rather than an omission: this project's declared
          # dependencies are the comparands it measures, and none of
          # them is what this analysis is about -- an alert against a
          # comparand belongs to the project that publishes it
          build-mode: none
          # `queries` is deliberately unset, which is the default query
          # suite: the init action has no query_suite input, its
          # `queries` input adding queries to the default suite instead
          # (`security-extended` being the widening default setup calls
          # `extended`). Passing nothing is therefore the analysis the
          # setting would have performed, and the note is here because
          # "no input" is otherwise indistinguishable from "nobody
          # decided"

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          # what keeps the two languages' results apart in the same
          # commit's analysis: without a distinct category the second
          # upload replaces the first rather than adding to it
          category: /language:${{ matrix.language }}

  # the aggregate btclib-org/.github#459 asks of every codeql.yml in the
  # organization. A matrix reports one check context per cell, so a
  # branch rule could only ever name the cells, and the day a third
  # language is added the new cell falls outside the rule with nothing
  # red; one job that judges the run is a name that does not move.
  # btclib-org/.github#90 recorded the objection to writing this job --
  # an aggregate nothing requires is a name nothing holds -- and
  # btclib-org/.github#459 is what answers it: a context a rule could
  # name is a workflow's own to
  # offer, and whether to spend it is a branch-protection change, made
  # where REPOSITORY.md's "Required checks on main" records what this
  # repository requires. That list does not name this context
  codeql-passed:
    # the name and not the id is what such a rule matches, and a context
    # is keyed by name alone: two workflows with a job named "every job
    # passed" would produce one ambiguous check, and test.yml's aggregate
    # is the one main already requires
    name: "codeql: every job passed"
    # ordering, and nothing else -- the same rule test.yml's aggregate
    # states: what the step below judges is every job the run reports,
    # so a job of this workflow left out of this list is judged without
    # being waited for and turns the gate red until it is added here
    needs: [analyze]
    # !cancelled() rather than always(): a run superseded by the
    # concurrency group above is one a newer run speaks for, and this
    # job skips instead of failing for it -- a skip satisfying a rule
    # that names this context the same as a pass. The draft and closed
    # halves are the analysis job's own condition, so a draft skips
    # uniformly rather than being reported as a failure for an analysis
    # this workflow declined to run
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # what asking the API for this run's own jobs takes, and the same
      # read test.yml's aggregate holds for the same question.
      # REPOSITORY.md's "Token permissions" is where the elevations are
      # read back
      actions: read
    steps:
      # what test.yml's aggregate does, in this workflow: it asks the run
      # what its jobs concluded rather than reading `needs.*.result`.
      # REPOSITORY.md's "Required checks on main" has why -- that context
      # reported a red matrix as `success` here under an outage, and
      # reading it more strictly was tried first and is not the answer,
      # since no strictness covers a shape the context does not report.
      # The organization's other aggregates read that context, in the
      # spellings btclib-org/.github#464 lists: an `if:` expression a skip
      # leaves unevaluated, which is btclib-org/btclib#1001's own failure,
      # and shell tests over `join(needs.*.result, ' ')` that always run
      # and so log what the context held, which records the hole rather
      # than closing it -- and which an empty join walks past without an
      # iteration (btclib-org/btclib#1454). A run's own listing is subject
      # to neither, and the count below is what refuses a listing that
      # describes nothing.
      #
      # The price is that this script and test.yml's are the same script
      # in two files: `needs` reaches nothing outside its own workflow and
      # a step is not shared between two, so an aggregate is per workflow
      # whatever it is written in
      - name: Fail unless every other job of this run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `.status` beside the conclusion so that an unfinished job says
          # which kind it is: queued and running are one word to
          # `.conclusion` and two facts to a reader of the log
          jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.conclusion // "unfinished")\t\(.status)\t\(.name)"')
          # printed before it is judged: the job whose purpose is to be
          # trusted is the one that has to be able to say what it saw
          printf '%s\n' "${jobs}"
          # awk and not grep: a tab in a grep pattern is one
          # implementation's extension and a literal "t" in another's,
          # where awk's field separator is POSIX
          # `skipped` is a conclusion this accepts, and section 10 of
          # the organization standard is where that sits: it asks for a
          # step failing on anything but `success` and `skipped`, and
          # names what produces the second -- a run superseded by its
          # concurrency group, and a `changes` job that found the diff
          # touches nothing those jobs read
          bad=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 != "success" && $1 != "skipped" && $1 != "unfinished"')
          unfinished=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 == "unfinished"' | wc -l | tr -d ' ')
          # each annotation names the rows it is about, an annotation
          # being what the checks page shows without the log being
          # opened. `%0A` is a newline to one, and the tab goes with it:
          # the columns line up in a log and not in this
          annotate() {
            printf '::error::%s' "$1"
            printf '%s' "$2" | tr '\t' ' ' | awk '{ printf "%%0A%s", $0 }'
            printf '\n'
          }
          verdict=0
          if [ -n "${bad}" ]; then
            annotate "these jobs of the run did not succeed:" "${bad}"
            verdict=1
          fi
          # exactly one job of the run may be unfinished, and it is this
          # one. Counted rather than excluded by name, a name being what
          # goes stale when this job is renamed -- and none unfinished at
          # all is refused too, a listing with no job running not being a
          # listing of the run this step is running in
          if [ "${unfinished}" -ne 1 ]; then
            # no colon on this one, and rows after it only if there are
            # any: nothing unfinished is the case that says nothing, and
            # a colon would promise a list
            annotate \
              "this check should be the run's one unfinished job; ${unfinished} are" \
              "$(printf '%s\n' "${jobs}" | awk -F'\t' '$1 == "unfinished"')"
            verdict=1
          fi
          exit "${verdict}"
