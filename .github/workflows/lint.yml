---
name: lint

# what this workflow runs is .pre-commit-config.yaml itself, never a
# second list of the same tools: a commit and CI then enforce one thing,
# and a hook added to that file needs no edit here
on:
  push:
    branches: [main]
  pull_request:
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, cancelling
    # the run linting the actual merge commit one to two seconds after
    # every merge -- observed on this repository's own main after #99
    # merged. The concurrency block below groups a pull_request run by
    # the pull request's own number instead, which cannot equal any
    # push's github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow: in a called workflow
  # that expression is the *caller's* name, so two workflows called from
  # one place would share a group and cancel each other.
  # github.event.pull_request.number, not github.ref alone, is what a
  # pull_request run of any action groups by, so a closed run cannot
  # resolve to the same group as a push to main -- the pull_request
  # trigger's own comment above has the evidence. A push carries no
  # pull_request context, so github.ref is still what groups it,
  # unchanged
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    # a draft pull request is work in progress and spends no runner here
    # either. A closed one spends none either -- the trigger above takes
    # the closed event only to supersede a run this ref's group is still
    # holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # the cache key needs the runner image, not only the OS: a
      # pre-commit environment built on one image is not always usable on
      # the next one, and a stale hit fails in the hook rather than here
      - name: Identify the runner image
        id: image
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-${{
            hashFiles('.pre-commit-config.yaml', '.python-version') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ steps.image.outputs.os }}-

      # --locked, never --frozen: a dependency added to pyproject.toml
      # without a re-lock would otherwise be type checked against a stale
      # environment, with nothing said about it
      - name: Run every hook
        run: >-
          uv run --locked --only-group lint
          pre-commit run --all-files --show-diff-on-failure
