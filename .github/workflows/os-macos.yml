---
name: os-macos

# the macOS half of the platform sweep, and os-ubuntu.yml's header is
# the argument for both: why the gate runs one cell, what a sentinel
# then owes, and why the ubuntu matrix keeps the gate's own cell rather
# than cutting it out.
#
# What macOS adds is the one platform this project is never otherwise
# asked about. The gate is ubuntu, and no Windows sentinel exists for the
# reason REPOSITORY.md records, so this cell is the whole of what says
# whether the comparands install and answer the vendored vectors anywhere
# but Linux.
#
# The matrix carries `macos-latest` alone, arm64: macOS is supported on
# arm64 alone, as section 10 of btclib-org/.github's README.md says.
#
# It gates no commit and no merge -- a macOS regression sits on main for
# at most a week -- and nothing calls it, this project having nothing to
# publish; see os-ubuntu.yml's own trigger for that.

on:
  schedule:
    # the day and the time are section 10's grid in btclib-org/.github
    # and not this file's to restate. What is local is why this and
    # os-ubuntu.yml want separate days at all: a platform sentinel is every
    # image times every interpreter, and two exhaustive matrices in
    # one morning is the queue this design exists to avoid.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "16 5 * * 4"
  # the escape hatch, and the only trigger besides the schedule: see
  # os-ubuntu.yml, where the absence of a workflow_call is argued once
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, the comparands' own build scripts) can read the
# token, so it must not be able to write to the repository
permissions:
  contents: read

# cancel superseded runs: the subject here is the commit, which a newer
# one supersedes. Named literally rather than with github.workflow, which
# in a called workflow is the caller's name
concurrency:
  group: os-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-macos:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # every cell to the end: which interpreter fails on which image is
      # the whole answer, and stopping at the first one hides the rest
      fail-fast: false
      matrix:
        # the one image this platform gets: see this file's header for
        # why
        os:
          - macos-latest
        # every interpreter this project supports, the one the gate runs
        # included, and the two ends are a comparand's rather than a
        # choice: see the matrix of os-ubuntu.yml, where that is written
        # down once
        python:
          - "3.11"
          - "3.12"
          - "3.13"
    # far above what a run of the suite needs, the sdist builds below
    # included, and it bounds a hung job rather than a slow one: what
    # this workflow exists to move is queueing, which happens before a
    # job starts and is not counted here
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false

      # where the ubuntu images hand this project its C toolchain for
      # free -- the toolchain comment on the coverage job of test.yml is
      # that argument -- not so on macOS.
      # `secp256k1` demands a `pkg-config` before it will build at all, and
      # pyproject.toml's [tool.uv] supplies it; autoconf, automake and
      # libtool are in no macOS toolset or image manifest, and
      # `electrum-ecc` needs all three, its sdist carrying libsecp256k1
      # with a configure.ac and no generated `configure`, so its build
      # runs autogen.sh. Without them the install fails with the wrapper
      # named and the missing tool guessed at, which is the failure this
      # step spends thirty seconds not having.
      #
      # What the images carry is theirs to answer rather than this
      # comment's to keep true, and the answer is one query per tool:
      #
      #     gh api -X GET search/code --jq .total_count \
      #       -f q='autoconf repo:actions/runner-images path:images/macos'
      #
      # zero for each of the three, against a hit in both the toolset and
      # every image manifest when the same query is asked of
      # `path:images/ubuntu`. Harmless on the day that changes: brew
      # installing what is already installed is a no-op, not an error
      - name: Install the autotools the macOS images do not carry
        run: brew install autoconf automake libtool

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # which of an index's two artifacts each comparand's install
      # resolved to. On this one image every comparand that publishes a
      # wheel resolves to it -- `secp256k1` publishes a wheel for arm64,
      # the architecture of the one image here -- so what the record buys
      # is the day that stops being true: an index dropping the wheel is a
      # different binary under an unchanged version, and this is what says
      # so instead of leaving the divergence to be blamed on the wrapper.
      # Recorded and not asserted, for the reason the same step gives in
      # test.yml
      - name: Record which artifact each comparand's install resolved to
        run: |
          uv run --locked --no-default-groups --group test \
            python scripts/artifacts.py

      # --no-cov for the reason btclib-org/.github's reusable-os-suite.yml
      # gives beside its own, which os-ubuntu.yml calls rather than
      # giving the reason itself now (btclib-org/.github#35)
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest --no-cov
