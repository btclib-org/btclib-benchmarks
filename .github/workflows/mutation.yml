---
name: mutation

# Coverage answers "was this line executed"; this answers "would the suite
# notice if it were wrong". `fail_under = 100.0` in pyproject.toml already
# says every line and branch of src/btclib_benchmarks/ (this scope's own
# four modules) and scripts/artifacts.py runs -- it says nothing about
# whether anything asserts on what they compute, which is what a surviving
# mutant names one line of at a time.
#
# The baseline check, the session loop, the restore guard, the counts and
# the upload are btclib-org/.github's reusable-mutation.yml, called at
# @main so a fix there reaches this tree in one landing (section 10 of
# that repository's README.md, btclib-org/.github#35). What stays here is
# this tree's own subject matter -- the scopes `.github/mutation/*.toml`
# states, their budgets and the job's ceiling -- and the trigger, the
# schedule, the concurrency group and the permissions, none of which a
# reader of the callee could write for this tree.
#
# It gates nothing, and therefore does not appear in main's required
# checks, and must not -- that rule lives outside the repository and names
# its checks as literal strings.

on:
  # No pull_request trigger, unlike links.yml, which does run itself when
  # its own configuration changes. The difference is the clock: this
  # session runs the better part of an hour, so a trigger on
  # .github/mutation/*.toml would hang that off a pull request it is not
  # allowed to gate. What that trigger would have caught is caught cheaply
  # elsewhere -- check-toml parses these files on every commit, and
  # `cosmic-ray baseline`, which the callee runs first, fails the run
  # before any mutant if a test command has gone stale
  schedule:
    # the day and the time are section 10's grid in btclib-org/.github
    # and not this file's to restate: that section gives `mutation` the
    # day and the hour, and this repository the minute
    - cron: "16 5 * * 1"
  # the escape hatch: a session worth re-running on demand, after a
  # survivor is fixed or a scope file's budget is argued about, rather
  # than waiting for the next scheduled one
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in this job can
# read it, and nothing here writes. In particular no issues: write --
# filing an issue per survivor is the obvious next step and the wrong one,
# a survivor being a test to write rather than a defect to track
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# cancel-in-progress because a dispatch is how somebody asks for these
# numbers now, and waiting behind the scheduled run would be the opposite
# of an escape hatch
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # one profile: this tree already ran its three scopes as sessions of one
  # job rather than as a matrix cell each, and the profile below keeps
  # that shape -- the ceiling is the sum of the three budgets plus the
  # environment, as the single job's own timeout-minutes used to be
  mutation:
    uses: btclib-org/.github/.github/workflows/reusable-mutation.yml@main
    with:
      profiles: >-
        [{"profile": "the suite's own scope", "slug": "suite", "ceiling":
        120, "sessions": "inputs.toml 20m\nprovenance.toml
        20m\nvectors.toml 75m"}]
