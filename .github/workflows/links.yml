---
name: links

# a real check, and no per-link suppression directives: disable/enable
# comment pairs guard the links somebody once worried about, while the
# ones that actually rot land outside every pair.
#
# What rots here is not evenly spread, which is why this workflow is
# worth its runner on a repository that ships no library. `vectors/`
# publishes a digest and an upstream URL for every vendored file, and
# that URL is the whole of what lets a reader check the copy against what
# it claims to be: a moved raw path turns provenance into an assertion.
# The pages under `results/` cite the comparands they measured, and a
# comparand is a third-party project that renames its repository without
# telling anyone. Neither is a link a test can follow.
#
# Not a pull request gate, and that is the whole design. A link rots
# without anybody touching the repository, so testing it per commit
# reports the internet's weather on somebody else's branch; and a third
# party returning 502 or throttling a runner would turn a red merge into
# a thing to re-run rather than a thing to fix. Weekly, on demand, and
# red in the Actions tab is where this belongs.
# It therefore does not appear in main's required checks, and must not:
# that rule lives outside the repository and names its checks as literal
# strings, which REPOSITORY.md records

on:
  schedule:
    # the day and the time are section 10's grid in btclib-org/.github
    # and not this file's to restate; why this is weekly at all rather
    # than a gate is the header above.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "16 4 * * 1"
  # the escape hatch, and the way to check a branch before merging a
  # documentation change that adds links
  workflow_dispatch:
  # so a change to this file is checked by the thing it configures.
  # This runs more often than the paths list suggests, and the difference
  # is worth knowing: the filter is evaluated against the pull request's
  # whole diff against its base, not against the push that triggered the
  # run, so once a pull request touches this file every later push to
  # that branch runs it too. Harmless -- it gates nothing -- but it does
  # mean a transient failure shows up on pushes that changed no link
  pull_request:
    # ready_for_review, so a pull request marked ready gets the run the
    # draft condition below withheld while it was a draft: the default
    # types do not include it, and without it a readied pull request
    # would wait for its next push to be checked at all.
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, which this workflow has no push
    # trigger to collide with -- but the weekly schedule and a
    # workflow_dispatch both also run on the default branch and would
    # resolve to that same ref. The concurrency block below groups a
    # pull_request run by the pull request's own number instead, immune
    # to that under any action, on the reasoning test.yml's own trigger
    # records from where it was observed to matter
    types: [opened, reopened, synchronize, ready_for_review, closed]
    paths:
      - .github/workflows/links.yml

# least privilege for the GITHUB_TOKEN. lychee is given it for github.com
# links only, where an unauthenticated runner is rate limited hard enough
# to look like rot; contents: read is all that needs.
# Deliberately not issues: write -- an automatic "link rot" issue is the
# usual next step here, and it would make this the only workflow in the
# repository that can write anything, to save a maintainer from reading a
# failure notification they already get
permissions:
  contents: read

# cancel superseded runs. Named literally rather than through
# github.workflow, as everywhere else here: in a called workflow that
# expression is the caller's name.
# github.event.pull_request.number, not github.ref alone, is what a
# pull_request run of any action groups by -- the pull_request trigger's
# own comment above has the reasoning. Neither schedule nor
# workflow_dispatch carries pull_request context, so github.ref is still
# what groups either, unchanged
concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check the documentation links
    # a draft pull request is work in progress and spends no runner here
    # either: the same condition the gates carry, and ready_for_review is
    # a trigger type above for the same reason. A closed pull request
    # spends none either -- the trigger above takes the closed event only
    # to supersede a run this ref's group is still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    # a few hundred requests with retries; a job past this is hung on one
    timeout-minutes: 15
    steps:
      # every action pinned to a commit SHA with the tag in the comment:
      # a tag, let alone a branch, is a name its owner can move
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false

      - name: Check the links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # the prose, not the code: a URL in a Python comment cites a
          # BIP or a comparand's source and is a reference rather than
          # something a reader clicks. What is checked is what a reader
          # is invited to follow -- the root markdown, the documentation
          # sources, the published pages under `results/`, and the two
          # READMEs that sit next to what they describe rather than at
          # the root, `tests/` saying which helper each test judges and
          # `vectors/` carrying the provenance of every vendored file.
          # `.claude/` is left out: it is the agent's own configuration,
          # not documentation, and nobody follows a link from it.
          # --no-progress because the log is not a terminal; the retries,
          # the wait and the timeout are what keep a slow or throttling
          # host from being reported as a dead one.
          # No --cache: lychee keeps it on disk under the workspace, a
          # run starts from a fresh one and no step here restores it, so
          # across runs the flag decides nothing -- and a restore step
          # would not make it decide much, lychee's default
          # --max-cache-age of 1d discarding the whole of it on a weekly
          # schedule. Within a run lychee collapses repeated URLs by
          # itself: `lychee --offline --no-progress` over the globs below
          # answers more links in Total than Unique with no cache
          # anywhere.
          # `--accept` is lychee's own default range with 429 added to it,
          # rather than a list of codes: the flag replaces the default
          # instead of extending it, and `lychee --help` gives that
          # default as 100..=103,200..=299, so a list naming fewer, a
          # "200,206,429", makes a 201 or a 204 a dead link -- a host
          # that starts answering 204 to a HEAD does it with nobody
          # touching the tree -- to add a 206 the default already covers.
          # 429 is the one code worth adding, a rate limit being an
          # answer from a host that is alive.
          # --timeout 45, against lychee's default of 20: what is being
          # bought is the difference between a host that is slow from a
          # runner and a host that is gone, and the default is short
          # enough to report the first as the second -- with the retries
          # above making it three timeouts rather than one. If a URL
          # times out run after run it belongs in a .lycheeignore, with
          # the measurement beside it, and not here
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 45
            --accept 100..=103,200..=299,429
            "*.md" "docs/**/*.md" "results/*.md"
            "tests/*.md" "vectors/*.md"
          # fail the job, rather than only summarizing: a green run that
          # found dead links is the state this workflow exists to end
          fail: true
        env:
          # for github.com links only, per the permissions comment above
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
