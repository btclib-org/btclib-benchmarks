---
name: deps-oldest

# the floor sentinel: every direct dependency taken down to the oldest
# release its own specifier in pyproject.toml still allows, on the
# interpreter requires-python names, and then put through the suite.
# deps-latest.yml asks whether a newer release still works; this asks
# whether the oldest one this tree still claims does -- section 10 of
# btclib-org/.github calls the two a mirrored pair.
#
# What a floor claims here is not the tooling: the comparands are this
# project's dependencies rather than a bench group, each declared as a
# floor rather than a pin, and pyproject.toml's comment over them says
# each floor records the release the tables' numbers were taken
# against. Installing that release again is what nothing else here
# does: deps-latest.yml resolves the other way, and everything else
# passes --locked and gets the one resolution somebody wrote down,
# which for a floor is the version it never has to be true of.
#
# --resolution lowest-direct, not lowest: lowest takes every transitive
# dependency to its own minimum as well, resolving environments nothing
# published has ever run and turning a red into noise about a release
# this tree never claimed to support. lowest-direct moves what
# pyproject.toml itself declares a floor for, which is the claim being
# checked. Where the mode is declared, and why it is not a flag on the
# step that resolves, is beside the job below.
#
# A group entry declaring no lower bound has no floor to verify, and uv
# warns on each one it finds. Here those warnings are what the run
# reports, and the resolution fails among the releases they name rather
# than at any comparand's floor: btclib-org/btclib-benchmarks#320 is
# where the bound each entry of [dependency-groups] owes is argued.
#
# 3.11, and not the 3.13 .python-version pins: that pin is a ceiling
# two of the comparands' wheels set, its own header giving the reason,
# where a floor run asks the other end -- requires-python's >=3.11,
# which secp256k1lab sets. One cell and one image, because a floor is
# one claim to verify rather than a range to scan, and the range is
# already deps-latest.yml's and os-ubuntu.yml's.
#
# No lint job, unlike deps-latest.yml's. That job is there because mypy
# is a local hook shelling out to uv, so a new mypy release adds a
# check this code base fails before the next re-lock catches it. A
# floor resolution moves mypy to a release already behind instead,
# which is a different question, and section 10 gives this sentinel the
# claim a floor makes rather than a second opinion on the tooling.
#
# Nothing here gates anything, by construction: a separate workflow,
# with no aggregate job, named by no branch protection rule. This job
# is expected to go red for reasons no pull request introduced, and a
# red check nobody can act on from a branch is noise. It opens no issue
# on failure either, which would cost issues: write in a job that needs
# nothing but read; a failed scheduled run notifies the last person to
# have touched the cron below, and that is the signal

on:
  schedule:
    # the instant is section 10's grid in btclib-org/.github, the
    # workflow's day and hour in one table and this repository's minute
    # in the other, and neither is restated here.
    # Only the default branch schedules workflows, so on any other
    # branch this is reachable through the dispatch below alone
    - cron: "16 3 * * 4"
  # the escape hatch: worth reaching for on a branch that moves a floor
  # in pyproject.toml, which is the one edit whose effect this workflow
  # is the only thing that measures
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, the comparands' own build scripts) can read the
# token, so it must not be able to write to the repository
permissions:
  contents: read

# named literally rather than with github.workflow: nothing calls this
# workflow, but that expression is the caller's name when something does,
# and the convention is what keeps the groups distinct
concurrency:
  group: deps-oldest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-oldest:
    name: Run the suite, dependencies at their declared floor
    runs-on: ubuntu-latest
    # the resolution mode, declared once for the whole job rather than
    # passed to the step that resolves. `uv lock` records a non-default
    # mode inside uv.lock, and a later uv command running under the
    # default `highest` reads that lock as stale -- so the --locked
    # below would refuse the lock the step above it had just written,
    # before installing anything and before reaching pytest. Setting it
    # here is what makes both commands agree, and keeps --locked meaning
    # what it says
    env:
      UV_RESOLUTION: lowest-direct
    # far above what a run of the suite needs, the resolution below and
    # the sdist builds under it included: what it bounds is a hung job
    timeout-minutes: 30
    steps:
      # every action is pinned to a commit SHA, the tag in the comment: a
      # tag, let alone a branch, is a name its owner can move
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the checkout of the coverage job in test.yml
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # cached for the reason deps-latest.yml gives beside its own
          enable-cache: true
          python-version: "3.11"

      # re-resolves every direct dependency to the oldest release its own
      # specifier in pyproject.toml still allows, the mode coming from
      # the job's env above; the header says what that reaches and what
      # it structurally cannot. This rewrites uv.lock, harmless on an
      # ephemeral checkout and worth knowing before running the same
      # command in a working tree
      - name: Resolve every direct dependency to its declared floor
        run: uv lock

      # what makes a red here readable: the version every comparand's
      # floor resolved to, and whether an index served a wheel for it on
      # this interpreter or the runner built one. The same step in
      # deps-latest.yml records versions newer than the pages were
      # measured against; these are older, and a resolution nobody can
      # read afterwards is a red with no evidence in it
      - name: Record which artifact each comparand's install resolved to
        run: |
          uv run --locked --no-default-groups --group test \
            python scripts/artifacts.py

      # still --locked, which is not a contradiction: the step above
      # wrote that lock under this job's own mode, so this asserts
      # nothing moved between the two.
      # --no-cov, against the --cov that `addopts` carries: what this
      # cell asks is whether the declared floors install and the suite
      # holds on them, and the coverage job of test.yml is where the
      # 100% ratchet is measured and gated. A floor that took a branch
      # the locked resolution does not would report a number under the
      # ratchet and name it, where the finding is the resolution's
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest --no-cov
