---
name: claude-review

# Claude reading a pull request against REVIEWING.md, and answering a
# comment naming @claude. The prompt, the credential guard, the action,
# the verdict check and the mention are btclib-org/.github's:
# reusable-claude-review.yml, called at @main so a fix there reaches this
# tree in one landing (section 10 of its README.md). What stays here is
# the trigger, the concurrency group, the workflow-level permissions and
# this header (issue btclib-org/.github#35).
#
# Not a required check, and it must not become one. What it produces is
# inline comments and a summary posted as a GitHub review of type
# COMMENT, an opinion for the author to weigh -- REPOSITORY.md's rule is
# that `main`'s required contexts are named outside the repository, and a
# review that gates a merge would make a model's judgement a branch rule.
# The required checks stay what they are, and which ones those are is
# REPOSITORY.md's to record and the endpoint's to answer.
#
# It is one more job on every pull request, which is not free: the
# concurrent-job ceiling belongs to the organization rather than to this
# repository, so a slot taken here is one a sibling repository's matrix
# waits behind. REPOSITORY.md states that ceiling and carries the command
# that answers which plan sets it. It earns the slot by being short -- it
# reads a diff, it does not build a matrix -- and by skipping a draft, as
# test.yml does in its own `if:` and lint.yml through the workflow it
# calls.
#
# extra-prompt is passed nothing rather than an empty string: it takes a
# paragraph on what the calling tree ships that a review cannot check
# without knowing it, and what a review of this tree has to know is what
# the shared prompt already says (btclib-org/.github#1169).
# extra-allowed-tools likewise: it grants the tools such a paragraph asks
# for, and this caller writes none. An explicit empty value would say
# something the absence does not.

on:
  pull_request:
    # ready_for_review so a pull request marked ready gets the review the
    # draft condition in reusable-claude-review.yml withheld while it was
    # a draft: the default types do not include it, and without it a
    # readied pull request would wait for its next push to be reviewed at
    # all. The same reasoning links.yml carries for the same type.
    # closed too: the group below is at the workflow level, so a closed
    # run enters it when the run is created, before any job's own `if:`
    # is read, and can cancel a review still holding the group -- what
    # declines the actual review on a closed pull request is
    # reusable-claude-review.yml's own job-level `if:`, not this file's
    types: [opened, reopened, synchronize, ready_for_review, closed]
  # the on-demand half: somebody writes @claude in a comment on a pull
  # request, or on a line of its diff, and asks for something the automatic
  # pass did not answer
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# least privilege for the GITHUB_TOKEN, elevated on the calling job below
# and nowhere else
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here. One key serves the review and the @claude answer both: a
# pull_request event keys on the pull request's number, so a push
# supersedes the review it overtakes, and every other event keys on
# github.run_id, which no two runs share, so an answer to a mention
# neither cancels one nor is cancelled by one. The number alone would not
# do that, a pull_request_review_comment event carrying
# github.event.pull_request.number too and so landing a mention in the
# review's own group.
#
# btclib-org/btclib-secp256k1#593 is why this sits here rather than on
# the job below: a workflow-level group is claimed when the run is
# created, before any job's `if:` is read, where whether a job an `if:`
# skips claims a job-level group is the question that issue closed
# without answering
concurrency:
  group: >-
    claude-review-${{ github.event_name == 'pull_request'
    && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # one calling job reaches both of the called workflow's jobs, and each
  # of them declines the events that are not its own -- the review
  # answers a pull_request, the mention a comment carrying @claude -- so
  # this job carries no `if:` of the review's: the switch, the draft
  # decline and the fork check are the called workflow's, read against
  # this caller's own event. A condition lifted up here would take the
  # answer to a mention out with the review.
  #
  # Permissions do not inherit through a call, and a called workflow's
  # own block can only downgrade what the caller granted, so the write
  # scopes are declared here rather than assumed from the read-only
  # default above. What btclib-org/.github#912 measures is the case this
  # is: a scope a called job declares and the calling job omits ends the
  # run in a startup_failure before a step executes.
  #
  # The credential is named rather than inherited: `secrets: inherit`
  # hands the called workflow every secret this repository can see, which
  # is what zizmor's secrets-inherit audit refuses, where the one it
  # declares is the one it needs
  claude:
    uses: btclib-org/.github/.github/workflows/reusable-claude-review.yml@main
    permissions:
      contents: read
      # what posting the review, or the answer to a mention, takes
      pull-requests: write
      # the OIDC token the action mints during its own startup, whatever
      # the Anthropic credential is
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
