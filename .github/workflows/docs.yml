---
name: docs

# the third gate, and a question of its own: does the documentation
# build. Without it nothing in CI builds it, only Read the Docs does,
# with -W, so a markdown link these `{include}`-based pages get wrong
# fails here rather than only after the merge, on a service whose
# failure is not a check on the pull request.
#
# The build itself, the checkout and the unresolved-link check are
# btclib-org/.github's: reusable-docs.yml, called at @main so a fix
# there reaches this tree in one landing (section 10 of its README.md).
# What stays here is the trigger and the concurrency group. Landing
# this caller drops the `python-version: "3.14"` this job used to pin
# to match .readthedocs.yaml: the reusable workflow takes no such
# input, section 10 leaving a gate's interpreter to `.python-version`
# with no exception named for this one, so the build now runs on 3.13,
# this tree's own pin. `.readthedocs.yaml` moves to the same pin in
# the same change, rather than the two disagreeing; its own comment
# has the reason (btclib-org/.github#35)
on:
  push:
    branches: [main]
  pull_request:
    # closed too, though the job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, cancelling
    # the run building the actual merge commit's documentation one to
    # two seconds after every merge -- observed on this repository's own
    # main after #99 merged. The concurrency block below groups a
    # pull_request run by the pull request's own number instead, which
    # cannot equal any push's github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # named literally, never through github.workflow: in a called workflow
  # that expression is the *caller's* name, so two workflows called from
  # one place would share a group and cancel each other.
  # github.event.pull_request.number, not github.ref alone, is what a
  # pull_request run of any action groups by, so a closed run cannot
  # resolve to the same group as a push to main -- the pull_request
  # trigger's own comment above has the evidence. A push carries no
  # pull_request context, so github.ref is still what groups it,
  # unchanged
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the checkout, the uv setup, the build and the unresolved-link check
  # are btclib-org/.github's; the draft and closed declines are the
  # called workflow's own, reading github.event.pull_request.draft and
  # github.event.action off this caller's trigger. This tree has no git
  # submodule for the checkout to initialize and no script of its own to
  # run against the built pages, so both inputs are left at their
  # defaults
  docs:
    uses: btclib-org/.github/.github/workflows/reusable-docs.yml@main
