---
name: deps-latest

# the dependency sentinel: everything uv resolves, upgraded to the newest
# release that satisfies pyproject.toml, and then put through the suite
# and the lint gate.
#
# On most repositories this watches the tooling. Here it watches the
# subject. Every dependency of this project is a comparand, every one of
# them is declared as a floor rather than a pin, and the reason is in
# pyproject.toml: the premise of a comparison is whatever `pip install`
# currently gives a user, so a new release is to be picked up and
# measured rather than refused. That premise is exactly what nothing
# else checks -- every other workflow passes `--locked`, so what CI runs
# is the resolution someone locked, and a comparand that has changed its
# API, dropped an interpreter or stopped answering a vendored vector
# since then goes unnoticed until somebody re-locks by hand.
#
# The obvious alternative, dropping --locked from test.yml and resolving
# afresh on every run, is what this workflow exists instead of: a pull
# request would go red for a release in somebody else's repository, with
# main's required checks in front of it, and the contributor holding the
# branch cannot fix any of it. pytest runs with
# filterwarnings = ["error"] and coverage with a fail_under ratchet, so
# the ways an upstream release turns this tree red without touching it
# are not hypothetical -- and here they include an index dropping a wheel
# for an interpreter the matrix below runs, which is a build from an
# sdist and not a resolution failure. Determinism is what makes the gate
# legible; the early warning belongs on a schedule, off the critical
# path.
#
# Scope: what uv resolves. Not the pre-commit hook revisions, which are
# pinned in .pre-commit-config.yaml and bumped by pre-commit.ci's weekly
# pull request -- that pull request runs the merge gate, so ruff,
# check-sdist, pyroma and the other pinned hooks already have their
# sentinel. mypy is the exception, its hook being local and shelling out
# to uv, so it is the lock that pins it. Not sphinx at latest either:
# docs.yml builds the documentation from the lock, and this project
# subscribes no documentation service that would build it otherwise.
#
# Nothing here gates anything, by construction: a separate workflow, with
# no aggregate job, named by no branch protection rule. That is the
# point. This job is expected to go red for reasons no pull request
# introduced, and a red check nobody can act on from a branch is noise.
# It opens no issue on failure either, which would cost issues: write in
# a job that needs nothing but read; a failed scheduled run notifies the
# last person to have touched the cron below, and that is the signal

on:
  schedule:
    # the day before Dependabot's, which is the whole point of the
    # placement: this reports on an upgrade before the pull request
    # carrying it opens, and .github/dependabot.yml says the same from
    # its own side. Which day that is, and the time, are section 10's
    # grid in btclib-org/.github and not this file's to restate.
    # Only the default branch schedules workflows, so on any other branch
    # this is reachable through the dispatch below alone
    - cron: "16 4 * * 3"
  # the escape hatch: worth reaching for on a branch that moves a floor
  # in pyproject.toml, which is the one edit whose effect this workflow
  # is the only thing that measures
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN: everything running in a job
# (actions, dependencies, the comparands' own build scripts) can read the
# token, so it must not be able to write to the repository
permissions:
  contents: read

# named literally rather than with github.workflow: nothing calls this
# workflow, but that expression is the caller's name when something does,
# and the convention is what keeps the groups distinct
concurrency:
  group: deps-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the checkout, the uv setup, the runner-image step, the hook cache,
  # the upgrade and the suite and lint runs over it are
  # btclib-org/.github's: reusable-deps-latest.yml, called at @main so a
  # fix there reaches this tree in one landing (section 10 of its
  # README.md). What stays here is the trigger, the concurrency group,
  # the workflow-level permissions and this job's own id, and the facts
  # the called workflow asks a caller for rather than states itself: the
  # matrix and `pre-suite-script` (btclib-org/.github#35)
  #
  # one image and the two ends of the interpreter range, where
  # os-ubuntu.yml runs both images and everything between: the variable
  # here is which release of each comparand the resolver picks, and
  # holding the platform still is what makes a red column mean that and
  # only that. A red cell here with os-ubuntu.yml green is an upgrade;
  # red in both is the platform. One variable each, and the pair reads
  # as a difference.
  #
  # The low end earns its place rather than being symmetry: a comparand
  # dropping 3.11 does not fail to resolve, it resolves to an older
  # release there and keeps the job green while 3.11 quietly stops being
  # measured against what everybody else runs. This tree has no git
  # submodule and no hook resolving a release name in its own refs, so
  # `submodules`, `fetch-depth` and `fetch-tags` are left at their
  # defaults
  #
  # `pre-suite-script` runs between the upgrade and pytest, where
  # `scripts/artifacts.py` ran before this tree called that workflow: the
  # record is worth more here than anywhere else, this being the one job
  # where a comparand's version is not the one the pages were measured
  # against, so the tags it prints are what a reader compares with the
  # provenance block of a page before believing that a row moved
  deps-latest:
    uses: btclib-org/.github/.github/workflows/reusable-deps-latest.yml@main
    with:
      runners: '["ubuntu-latest"]'
      python-versions: '["3.11", "3.13"]'
      pre-suite-script: scripts/artifacts.py
