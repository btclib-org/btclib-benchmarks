---
name: test

# what is tested here is the scripts' helpers -- the backend probes, the
# table formatting -- and never a timing: a measurement is the one thing
# a test cannot assert, and no workflow in this repository runs a
# benchmark. tests/README.md says which helper each test judges.
#
# One cell is what a merge waits for: `ubuntu-latest` on the interpreter
# `.python-version` pins. The images and the interpreters it does not run
# are ubuntu.yml's and macos.yml's, and ubuntu.yml's matrix keeps this
# cell rather than subtracting it -- a matrix with the gate's cell cut
# out of it is one whose shape has to be re-derived from this file before
# it can be read. What the trade costs is stated once, in ubuntu.yml's
# header: a regression on 3.11, on 3.12 or on aarch64 is not refused
# before a merge and sits on main until the sentinel for it runs
# (btclib-org/.github#85)
on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  pull_request:
    # closed too, though every job below declines the real work on it: a
    # merge or a close is neither a push nor a synchronize, so a run
    # this pull request's own concurrency group is still holding
    # survives either unless the closed event lands in that same group
    # -- which this type is what makes it do, cancel-in-progress below
    # turning the landing into the cancellation. That was meant to be
    # *this* pull request's own group and nothing else's: github.ref for
    # a closed, merged pull request resolves to the base branch's ref
    # rather than refs/pull/N/merge, so grouping by github.ref alone put
    # the closed run in the push trigger's own group instead, cancelling
    # the run testing the actual merge commit one to two seconds after
    # every merge -- observed on this repository's own main after #99
    # merged. The concurrency block below groups a pull_request run by
    # the pull request's own number instead, which cannot equal any
    # push's github.ref under any action
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.event.pull_request.number, not github.ref alone, is what a
  # pull_request run of any action groups by, so a closed run cannot
  # resolve to the same group as a push to main -- the pull_request
  # trigger's own comment above has the evidence. A push carries no
  # pull_request context, so github.ref is still what groups it,
  # unchanged
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Run the suite, gated at 100% coverage
    # a draft pull request is work in progress and spends no runner here
    # either. A closed one spends none either -- the trigger above takes
    # the closed event only to supersede a run this pull request's own
    # group is still holding
    if: ${{ !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout leaves the token in .git/config by default, where
          # anything running afterwards can read it, and any step
          # archiving the workspace would carry it out of the job. No job
          # in any workflow here performs an authenticated git operation,
          # so nothing needs it to stay.
          # This is the checkout every other workflow here cites: the one
          # on the gate, which runs on every pull request
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # no python-version, where the sentinels pass a matrix cell:
          # `.python-version` is the one place the reference interpreter
          # is named and uv reads it, so a number written here would be a
          # second copy of it. That file also carries why it says 3.13
          # where the rest of the organization says 3.14 -- a comparand's
          # wheels rather than a preference -- and the range the
          # sentinels sweep has its own ends for the same kind of reason

      # one comparand builds a libsecp256k1 of its own on this cell:
      # `electrum-ecc` publishes no wheel anywhere, so its sdist runs
      # libsecp256k1's autogen.sh, which is what autoconf, automake and
      # libtool are for. The other wrappers resolve to wheels here and
      # build on the sentinels' other images instead -- `secp256k1`
      # wants pkg-config when it does, and ubuntu.yml and macos.yml
      # each name the cell where that happens. Four
      # tools, and no step asks apt for any of them: both `ubuntu-latest`
      # and `ubuntu-24.04-arm` carry all four already --
      # actions/runner-images' own manifests for Ubuntu24.04 and its
      # arm64 image list pkg-config 1.8.1, autoconf 2.71, automake 1.16.5
      # and libtool 2.4.7 among the preinstalled software. ISS 96 is the
      # thirty minutes and a red gate one hung `apt-get update` cost on a
      # step that was asking for what the image already had.
      # This is the toolchain comment ubuntu.yml cites. macos.yml carries
      # one of its own instead of citing this: the macOS images list
      # pkgconf and none of the three autotools, so what is free here is
      # a step there

      # which of an index's two artifacts each comparand's install
      # resolved to, printed before the assertions that are about to be
      # made against it. On this one cell every comparand that publishes
      # a wheel at all publishes one, so what the record buys is the day
      # that stops being true: an index dropping a cell is a different
      # binary under an unchanged version, and this is what says so
      # instead of leaving the divergence to be blamed on the wrapper.
      # The cells where it is already not true are the sentinels', and
      # each of those files names the divergence its own images print.
      #
      # Recorded and not asserted, which is the line this stays on the
      # right side of: it reads installed metadata and times nothing, so it
      # is neither a benchmark nor a claim that goes red the day an index
      # gains a wheel and the answer legitimately changes
      - name: Record which artifact each comparand's install resolved to
        run: |
          uv run --locked --no-default-groups --group test \
            python scripts/artifacts.py

      # --cov is not repeated here: `addopts` in pyproject.toml carries
      # it, and `fail_under = 100` is what makes this job the gate rather
      # than one more run of the suite. The sentinels pass `--no-cov`
      # against that same `addopts`, this being the one cell where the
      # ratchet is measured
      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest

  test-passed:
    name: "test: every job passed"
    # what this list does now is order this job last, and nothing else:
    # what the step below judges is every job the run reports, which is a
    # different set that happens to coincide while this workflow has two
    # jobs. So the rule the gate depends on is that whatever it can see it
    # has to wait for -- a job added outside this list is judged without
    # being waited for, and turns the gate red until it is added here
    needs: [coverage]
    # the closed one for the same reason, added at the trigger above:
    # a closed pull request skips uniformly rather than tripping this
    # gate over a job it deliberately never ran
    # not always(): a cancellation of this run itself -- the concurrency
    # group superseding it with a newer push -- would still reach this
    # job and have it fail explicitly below, turning a cancellation the
    # newer run already speaks for into a required check with no defect
    # behind it. !cancelled() lets this job be skipped in that case
    # instead, which satisfies the check same as any other skip, while a
    # single job of the run cancelled on its own still fails below
    if: ${{ !cancelled() && !github.event.pull_request.draft && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # the one job here that reads anything but the tree, and a read
      # scope: it asks the API what this run's own jobs concluded.
      # REPOSITORY.md records it beside the others
      contents: read
      actions: read
    steps:
      # one required status check in branch protection instead of one per
      # matrix cell, which would have to be re-listed on every change to
      # the matrix. `!cancelled()` above is what makes a skipped cell, or
      # a cell cancelled on its own rather than by this run being
      # cancelled, reach this job rather than leave it unreported.
      #
      # What this asks is the run, and not `needs.*.result`, which twice
      # reported a red matrix as `success`: under the outage that had
      # codeload answer 503 and then 429, a cell died in "Set up job"
      # with the download of an action abandoned after three attempts,
      # and the failure never reached the needs context at all.
      #
      # Reading that context more strictly is what this replaces, and is
      # why strictness was not the answer. The step here before it printed
      # what it had been handed and demanded `success` of every result,
      # which covers every shape the context can report and cannot cover a
      # shape it does not report.
      #
      # Nor can the ways a job dies be enumerated instead: a cell pointed
      # at an action SHA that does not exist dies in the same step and does
      # arrive as `failure`, and a cell that fails in a step of its own
      # always did -- which is why the hole stayed hidden until GitHub had
      # an outage, and why what is asked here is a conclusion the run
      # reports rather than the route by which the job reached it.
      #
      # Printed before it is judged, which the step before this one
      # established and this keeps: the job whose whole purpose is to be
      # trusted is the one that has to be able to say what it saw. The
      # outage had to be reconstructed from job timestamps because it
      # could not.
      #
      # What it demands of that listing is two things rather than one,
      # because a job with no conclusion yet is not the same fact as this
      # job. Leaving an unfinished job out by name would go stale the day
      # this one is renamed, so it is counted instead: exactly one job of
      # the run may be unfinished, and it is this one. A second job that
      # has not finished is then waited for by being refused rather than
      # accepted, and none unfinished at all is refused too -- if no job of
      # the run is running, the listing is not describing the run this step
      # is running in, and a check that aggregates nothing is not a check
      # that passed.
      #
      # All of which holds while the run is this workflow's own, and stops
      # holding under `workflow_call`. A called workflow's jobs run inside
      # the caller's run, so `GITHUB_RUN_ID` is the caller's and the listing
      # would be every job of it, including those of any sibling workflow it
      # called: a sibling still running makes this red for a reason nobody
      # here can act on, and the remedy above -- add it to `needs` -- is not
      # available, `needs` reaching nothing outside its own workflow. It is
      # the shape this repository grows the day it gets a release workflow
      # calling this one and `lint.yml` side by side, and it wants deciding
      # then rather than papering over now: the gate belongs to whoever owns
      # the run, so either the caller carries it or that trigger goes. The
      # same surprise in another spelling is recorded in `lint.yml` beside
      # its concurrency group: `github.workflow` under a call is the
      # caller's name, which is why both groups are named literally.
      - name: Fail unless every other job of this run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `.status` beside the conclusion so that an unfinished job says
          # which kind it is: queued and running are one word to `.conclusion`
          # and two facts to a reader of the log
          jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.conclusion // "unfinished")\t\(.status)\t\(.name)"')
          printf '%s\n' "${jobs}"
          # awk and not grep: a tab in a grep pattern is one implementation's
          # extension and a literal "t" in another's, and the runner's is the
          # second -- where awk's field separator is POSIX. Which is also
          # why the count below is an awk filter piped to `wc` rather than
          # `grep -c`
          bad=$(printf '%s\n' "${jobs}" | awk -F'\t' '$1 != "success" && $1 != "unfinished"')
          unfinished=$(printf '%s\n' "${jobs}" |
            awk -F'\t' '$1 == "unfinished"' | wc -l | tr -d ' ')
          # both are reported before exiting rather than the first one
          # reached: a gate that says what it saw says all of it
          #
          # and each annotation names the rows it is about, because an
          # annotation is what the checks page shows without the log being
          # opened -- the same argument as printing the listing before
          # judging it, one reader further out. `%0A` is a newline to an
          # annotation, which is otherwise one line, and the tab goes with
          # it: the columns line up in a log and not in this. A literal `%`
          # would want `%25` and passes through unescaped, which no name a
          # matrix builds can contain
          annotate() {
            printf '::error::%s' "$1"
            printf '%s' "$2" | tr '\t' ' ' | awk '{ printf "%%0A%s", $0 }'
            printf '\n'
          }
          verdict=0
          if [ -n "${bad}" ]; then
            annotate "these jobs of the run did not succeed:" "${bad}"
            verdict=1
          fi
          if [ "${unfinished}" -ne 1 ]; then
            # no colon on this one, and rows after it only if there are any:
            # nothing unfinished is the case that says nothing, and a colon
            # would promise a list
            annotate \
              "this check should be the run's one unfinished job; ${unfinished} are" \
              "$(printf '%s\n' "${jobs}" | awk -F'\t' '$1 == "unfinished"')"
            verdict=1
          fi
          exit "${verdict}"
