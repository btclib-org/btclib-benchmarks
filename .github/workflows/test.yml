---
name: test

# what is tested here is the scripts' helpers -- the backend probes, the
# table formatting -- and never a timing: a measurement is the one thing
# a test cannot assert, and no workflow in this repository runs a
# benchmark. tests/README.md says which helper each test judges
on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # both ends are set by a comparand rather than chosen. 3.13 is
        # the ceiling: coincurve and secp256k1 publish no cp314 wheel,
        # and this project installs its comparands rather than mocking
        # them. 3.11 is the floor: secp256k1lab declares it, and
        # scripts/04-pure-python.py imports that unguarded
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # a toolchain, because three of the wrapper comparands compile a
      # libsecp256k1 of their own here: secp256k1 ships no wheel at all
      # and coincurve none for every cell, both wanting pkg-config, and
      # electrum-ecc ships only an sdist and runs libsecp256k1's
      # autogen.sh, which is what autoconf and automake are for
      - name: Install the build prerequisites of the wrapper comparands
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libtool autoconf automake

      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest

  test-passed:
    name: "test: every job passed"
    needs: [suite]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # the one job here that reads anything but the tree, and a read
      # scope: it asks the API what this run's own jobs concluded.
      # REPOSITORY.md records it beside the others
      contents: read
      actions: read
    steps:
      # one required status check in branch protection instead of one per
      # matrix cell, which would have to be re-listed on every change to
      # the matrix. `always()` above is what makes a cancelled or skipped
      # cell reach this job rather than leave it unreported.
      #
      # What this asks is the run, and not `needs.*.result`, which twice
      # reported a red matrix as `success`: under the outage that had
      # codeload answer 503 and then 429, a cell died in "Set up job"
      # with the download of an action abandoned after three attempts,
      # and the failure never reached the needs context at all.
      #
      # Reading that context more strictly is what this replaces, and is
      # why strictness was not the answer. The step here before it printed
      # what it had been handed and demanded `success` of every result,
      # which covers every shape the context can report and cannot cover a
      # shape it does not report.
      #
      # Nor can the ways a job dies be enumerated instead: a cell pointed
      # at an action SHA that does not exist dies in the same step and does
      # arrive as `failure`, and a cell that fails in a step of its own
      # always did -- which is why the hole stayed hidden until GitHub had
      # an outage, and why what is asked here is a conclusion the run
      # reports rather than the route by which the job reached it.
      #
      # Printed before it is judged, which the step before this one
      # established and this keeps: the job whose whole purpose is to be
      # trusted is the one that has to be able to say what it saw. The
      # outage had to be reconstructed from job timestamps because it
      # could not.
      - name: Fail if any job did not succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # this job is the one still running, so its own conclusion is
          # null and the filter below leaves it out
          jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | "\(.conclusion // "in progress")\t\(.name)"')
          printf '%s\n' "${jobs}"
          # awk and not grep: a tab in a grep pattern is one implementation's
          # extension and a literal "t" in another's, and the runner's is the
          # second -- where awk's field separator is POSIX
          bad=$(printf '%s\n' "${jobs}" | awk -F'\t' '$1 != "success" && $1 != "in progress"')
          if [ -n "${bad}" ]; then
            echo "::error::at least one test job did not succeed"
            exit 1
          fi
