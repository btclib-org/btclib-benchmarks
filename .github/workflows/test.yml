---
name: test

# what is tested here is the scripts' helpers -- the backend probes, the
# table formatting -- and never a timing: a measurement is the one thing
# a test cannot assert, and no workflow in this repository runs a
# benchmark. tests/README.md says which helper each test judges
on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Run the suite on ${{ matrix.python }}, ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # both ends are set by a comparand rather than chosen. 3.13 is
        # the ceiling: coincurve and secp256k1 publish no cp314 wheel,
        # and this project installs its comparands rather than mocking
        # them. 3.11 is the floor: secp256k1lab declares it, and
        # scripts/04-pure-python.py imports that unguarded
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # a toolchain, because three of the wrapper comparands compile a
      # libsecp256k1 of their own here: secp256k1 ships no wheel at all
      # and coincurve none for every cell, both wanting pkg-config, and
      # electrum-ecc ships only an sdist and runs libsecp256k1's
      # autogen.sh, which is what autoconf and automake are for
      - name: Install the build prerequisites of the wrapper comparands
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libtool autoconf automake

      - name: Run pytest
        run: uv run --locked --no-default-groups --group test pytest

  test-passed:
    name: "test: every job passed"
    needs: [suite]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # one required status check in branch protection instead of one per
      # matrix cell, which would have to be re-listed on every change to
      # the matrix. `always()` above is what makes a cancelled or skipped
      # cell reach this job rather than leave it unrun.
      #
      # Two things this step does that its predecessor did not, and the
      # first is why the second could be chosen at all.
      #
      # It prints what it saw, unconditionally and before judging it. This
      # is the job whose entire purpose is to be trusted, and on 2026-08-17
      # it reported success while a cell of the matrix had concluded failure
      # and the run it belongs to had concluded failure -- and it could not
      # say what `needs` had handed it, so the question had to be
      # reconstructed from job timestamps. One line of log answers it next
      # time.
      #
      # And it fails closed. Its predecessor enumerated the results that are
      # bad -- failure, cancelled, skipped -- which passes anything the list
      # does not anticipate, and the list is what left room for the above.
      # This one demands `success` from every result and refuses everything
      # else, whatever it turns out to be called.
      #
      # An empty `needs.*.result` is refused too, which is the same argument
      # one level up: a check that aggregates nothing is not a check that
      # passed.
      #
      # What this cannot promise is that it fixes 2026-08-17. If GitHub
      # reported the matrix as `success` despite that cell, then no
      # expression over `needs` can gate it and the aggregate has to read
      # something else -- the run's own jobs, through the API. Which of the
      # two it was is what the printing is for, and the next occurrence is
      # what would settle it.
      - name: Fail unless every job this check aggregates succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs.*.result: ${RESULTS:-<empty>}"
          if [ -z "$RESULTS" ]; then
            echo "::error::this check aggregates nothing: needs resolved empty"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a job this check aggregates concluded '$result'"
              exit 1
            fi
          done
