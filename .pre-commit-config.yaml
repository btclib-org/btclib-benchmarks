---
# Skip execution of one or more hooks using the SKIP environment variable:
# $ SKIP=mypy git commit -m "foo"
# $ SKIP=mypy,ruff-check pre-commit run --all-files
#
# If want to disable all hooks while committing, use the --no-verify/-n option:
# $ git commit -n -m "foo"

# these hooks are the lint gate: the lint workflow runs this very file, so
# what CI enforces is exactly what a commit enforces, with no second list
# of tools and versions to keep in step. What pre-commit.ci provides on
# top of that, and what it is kept for, is the periodic pull request
# bumping the revisions pinned below
ci:
  # a bot committing to a branch is at odds with the rest of this setup,
  # where no workflow token can write and every action is pinned to a
  # commit SHA: a failing hook is fixed by its author
  autofix_prs: false
  # no autoupdate_branch, as dependabot declares no target-branch: the
  # default is the default branch, which is the only branch a change
  # lands on
  autoupdate_commit_msg: "Update the pinned pre-commit hook revisions"
  autoupdate_schedule: weekly
  # the hooks pre-commit.ci cannot run: they shell out to uv, which is not
  # installed there, and the lint workflow covers them
  skip: [mypy]

repos:
  # this file checking itself. A `files` or `exclude` pattern that stops
  # matching anything is a hook that has quietly stopped running -- the
  # rule stays written down in this file and stops being enforced, with
  # nothing else here positioned to notice
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # this file checking itself further, on the two moves `autoupdate` makes
  # that it must not take. A rev naming only a major version follows every
  # future release of that major, which is the one thing a rev is here to
  # prevent -- and a prerelease is not a release.
  #
  # Not hypothetical: pre-commit.ci's weekly pull request offered both in
  # bitcoin-core-rpc, typos onto `v1` -- its repository keeps a floating
  # major tag beside the versioned one, and autoupdate prefers the shorter
  # name -- and pyroma onto 5.1b1, 5.1 having no released tag at all. One of
  # the two was merged before anyone read the two-line diff. This hook is
  # what makes the bot's pull request go red instead.
  #
  # pre-commit says the first half itself -- "appears to be a mutable
  # reference (moving tag / branch) ... not supported" -- on stderr, on a run
  # that then exits zero, which is the whole difference between a warning and
  # a gate.
  #
  # A commit SHA stays acceptable, should a hook ever want one: the pattern
  # requires the prerelease marker and its digits to end the value, which
  # forty hex characters do not
  - repo: local
    hooks:
      - id: pinned-rev
        name: every pre-commit rev names a released version
        language: pygrep
        entry: '^ *rev: "?v?([0-9]+|[0-9][0-9.]*(a|b|rc|dev)[0-9]+)"?$'
        files: ^\.pre-commit-config\.yaml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # not the default --fix=auto, which normalizes a file to its own
        # most frequent ending: a file entirely in CRLF is consistent by
        # that measure, so it stays, and the LF lines added to it are
        # converted the wrong way. This repository is LF throughout
        args: [--fix=lf]
      - id: check-case-conflict
      # no check-executables-have-shebangs, by check-hooks-apply's own
      # verdict: it selects on types [executable], nothing tracked here
      # carries that bit, and a hook that matches no file is not a guard
      # on the future but a line that reads as a rule while enforcing
      # nothing. That is the whole reason the meta hooks are in this
      # file, and overruling one of them would be an odd way to keep them
      #
      # its converse is on, and is the reason no file under `scripts/`
      # opens with "#!/usr/bin/env python3": a shebang is read by the
      # kernel only when the file is exec'd directly, which needs the
      # executable bit the hook above finds on nothing, and every script
      # here is invoked through the interpreter instead --
      # "uv run python scripts/03-libraries.py", which is how
      # CONTRIBUTING.md documents each of them. So the line would announce
      # an interpreter nothing consults, and it would cost this guard.
      # Unlike the hook above, this one selects on types [text] and so
      # matches every file whether or not any carries a shebang: what it
      # enforces is the pair, and the day a file needs one it also needs
      # chmod +x
      - id: check-shebang-scripts-are-executable
      # no byte order mark anywhere today, and the same kind of guard as
      # check-executables-have-shebangs: what it costs is one line, what
      # it buys is that an editor on another platform cannot quietly add
      # three bytes in front of a Python file
      - id: fix-byte-order-marker
      # this one *adds* "# -*- coding: utf-8 -*-" to every Python file.
      # UTF-8 has been the default source encoding since Python 3 and the
      # floor here is 3.11, so every line it would add is dead on arrival
      # - id: fix-encoding-pragma
      - id: check-yaml
      - id: check-json
        # `.vscode` is jsonc, not json: VSCode reads a comment in its own
        # settings.json and extensions.json, and a json parser rejects the
        # file at the first one. Excluded here for the reason it was once
        # dropped for altogether -- it is not a gap, prettier below is
        # given that directory and fails on what it cannot parse, which is
        # the question this hook asks. What check-json reaches instead is
        # `results/*.json`, `vectors/*.json` and .claude/settings.json,
        # none of them jsonc and none of them under prettier's `files`
        # allowlist -- so this is the only parser in the gate for the
        # first two, and the one pretty-format-json below shares the third
        # with
        exclude: ^\.vscode/
      # pretty-format-json reaches the json written by hand, which is
      # .claude/settings.json, and the exclude keeps it off the rest for a
      # reason that is not the one above: `results/*.json` is
      # `scripts/_results.py`'s output
      # (json.dumps(..., indent=2, ensure_ascii=False), read there), so a
      # formatter with its own idea of indent or key order is a second
      # writer of a file a script already owns, and the two disagreeing
      # is a diff nobody asked for on every run that follows a benchmark.
      # `vectors/*.json` is the opposite problem with the same answer:
      # vendored copies vectors/README.md pins to a sha256 each, checked
      # in scripts/_vectors.py on import, so a reformat would break the
      # digest as surely as hand-editing a byte would. Neither file is
      # this hook's to rewrite; check-json above still answers the
      # question worth asking of both, which is whether they parse.
      # `.vscode/` is jsonc, which this hook cannot read any more than
      # check-json can, and prettier's. What is left is what the hook is
      # for, at its defaults -- two-space indent and sorted keys, nothing
      # reading that file back in an order.
      # --autofix because every other fixing hook here corrects rather
      # than reports
      - id: pretty-format-json
        name: pretty-format-json (in place fixes)
        args: [--autofix]
        exclude: ^(\.vscode|results|vectors)/
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: detect-private-key
      - id: debug-statements
      - id: check-docstring-first
      # the hook's default, *_test.py, with neither args nor exclude.
      # What it is for is the one failure mode a test suite cannot report
      # on itself -- a file named so that pytest never collects it is not
      # a red test, it is no test.
      # test_*.py, i.e. --pytest-test-first, would guard the same thing,
      # pytest's default `python_files` collecting both; *_test.py, the
      # convention every module under tests/ follows, needs no args. No
      # exclude, and the hook's own exemption for conftest.py is what
      # keeps it that way: tests/conftest.py holds no test of its own,
      # only the sys.path insert that lets a test import
      # scripts/_vectors.py, so exempting its name from the pattern costs
      # nothing. The __init__.py exemption goes unused -- there is no
      # tests/__init__.py, tests/ is not a package, and the vector
      # loading a package __init__ would hold in btclib is
      # scripts/_vectors.py's job here, outside tests/ entirely.
      # tests/vectors_test.py is this hook's boundary case met rather
      # than avoided: the name reads as a loader, and is in fact the
      # suite that holds every vendored vector to the digest
      # vectors/README.md publishes for it
      - id: name-tests-test
      - id: check-toml
      # only files being *added* are measured, the hook intersecting its
      # arguments with git's added set, so a large file already tracked
      # does not trip it and the next one that size does. The default
      # 500 KB is left alone: uv.lock, the largest file this repository
      # tracks, sits under it, and every vendored vector is smaller
      # still, so the threshold has not yet forced a decision about
      # where a blob's provenance goes. It already has an answer for
      # when it does: vectors/README.md names where each vendored vector
      # came from and pins it to a sha256, whatever its size
      - id: check-added-large-files
      # there are none, and a submodule is the one dependency that would
      # not be in uv.lock, not be pinned by dependabot, and not be
      # visible in an sdist
      - id: forbid-submodules
  # the credentials of other systems, which is the half of secret scanning
  # GitHub's free plan does not cover: partner and provider tokens are
  # scanned server-side, the generic patterns (PEM keys, connection
  # strings, authentication headers) belong to Secret Protection, and the
  # API accepts that setting with a 200 and leaves it disabled.
  # detect-private-key above covers the PEM case, and the lint workflow
  # runs these hooks on every pull request, a fork's included, so this is
  # not only a local gate.
  # Not gitleaks: all of its hook ids invoke it with --staged, so under
  # "pre-commit run --all-files", which is what CI runs, it scans an
  # empty staged set and passes
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (credentials of other systems)
        # a benchmark of signing needs a key to sign with, and every
        # script here uses the same one, in the clear: BIP340 test vector
        # 1's, because the number being timed must not depend on which key
        # was drawn and a reader has to be able to reproduce the row. A key
        # published in a specification is the strongest possible case of
        # what a scanner cannot tell apart from a credential -- it is high
        # entropy, it is a real private key, and it is in a document
        # anybody can read.
        # Recorded in .secrets.baseline as already reviewed rather than
        # excluded from the scan: an exclusion makes a file blind for
        # good, where a baseline leaves the file scanned and the next
        # finding in it unreviewed. CONTRIBUTING.md has the command that
        # regenerates it
        args: [--baseline, .secrets.baseline]
  # what this repository publishes is prose: a README carrying tables and
  # the docstrings that say what each row measures and what it does not.
  # A benchmark whose explanation is misspelled is read as carelessly
  # measured, which is the one thing a table of numbers cannot afford.
  # Configured in pyproject.toml ([tool.codespell]) rather than in args
  # here: the skip list needs a paragraph of justification, and a hook
  # invocation is the wrong place for one
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (prose and comments)
        # the "clear" dictionary alone, where codespell's default is
        # "clear,rare": the other four builtins are what btclib measured
        # as mostly-wrong findings, and a hook whose findings are mostly
        # wrong earns an ignore list long enough to hide a real typo.
        # The same choice is made in every repository of this org
        args: [--builtin, clear]
  # the second spell checker, and not a replacement for the one above:
  # codespell matches whole words and keeps the hyphen inside the token,
  # so a hyphenated or snake_case misspelling is invisible to it, while
  # typos splits hyphens, snake_case and camelCase. Neither subsumes the
  # other, which is why both run. pyproject.toml ([tool.typos]) has the
  # configuration and the reasoning, as for codespell
  - repo: https://github.com/crate-ci/typos
    # a release tag, not the `v1` beside it: that one is a major-version
    # alias upstream moves onto each release, so `pre-commit autoupdate`
    # picks it as the newest tag and the pin stops being one -- the hook
    # would then follow every future 1.x, which is the whole of what a rev
    # is here to prevent. A dictionary that grows under a fixing hook is
    # not a detail: this one rewrites what it reads
    rev: v1.49.0
    hooks:
      - id: typos
        name: typos (identifiers and hyphenated words, in place fixes)
        # what the hook declares, restated rather than inherited: both
        # flags are choices this repository has to keep making. Dropping
        # --write-changes would make it a report where every other fixing
        # hook here corrects; dropping --force-exclude would make
        # [tool.typos.files] silent, because pre-commit passes filenames
        # and typos honours its own exclude list only under that flag --
        # measured, without it typos rewrites a misspelling already
        # present in the vendored Wycheproof file, corrupting the copy
        # against the digest vectors/README.md publishes for it
        args: [--write-changes, --force-exclude]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      # --fix: corrects in place, like every other fixing hook here
      - id: markdownlint-cli2
        name: markdownlint-cli2 (in place fixes)
        args: [--fix]
  # how a link destination is spelled, which markdownlint has no rule
  # for. The rule is the organization's: btclib-org/.github's README
  # states it, and the measurement behind it -- myst renders the
  # destination of a link it cannot resolve verbatim, so the publishing
  # repositories can key their built-html grep on one pattern only if
  # there is one spelling to key on (btclib-org/.github#20).
  #
  # Here it enforces a convention rather than catching a defect, and the
  # difference is what this comment is for. docs/source/conf.py resolves a
  # link out of an included root file to the page that renders it, so the
  # `./CONTRIBUTING.md` REVIEWING.md carries -- and which this hook holds
  # to that spelling -- becomes a link to this documentation's own
  # contributing page. A target no page here renders is left to myst,
  # which reports it and takes docs.yml's -W with it: measured with a
  # fresh environment, `[a](./REPOSITORY.md)` takes sphinx-build -E -W
  # --keep-going to exit 1 where the tree without it exits 0. So a root
  # file's link to anything this documentation does not render is written
  # as an absolute url, and the ones it does render are what this hook has
  # to check.
  #
  # Carried whole in every repository, for the reason the standard
  # gives: a rule with one
  # repository exempted is a rule somebody has to remember the exemption
  # for, and prose moves between these repositories. `pinned-rev` above
  # is the same arrangement -- the same hook in each repository, there
  # being no shared hook repository to write it in once.
  #
  # The pattern's first branch asks for a whole `[text](destination)`,
  # its link text stepping over a nested image because a badge is
  # "[![alt](src)](href)" and a link text written "[^]]*" stops at the
  # "]" closing the alt text -- which left every badge destination
  # unchecked in this hook's first shape. There is no badge in this
  # repository's markdown to demonstrate that on; the siblings that have
  # them are where it was measured. The lookbehind refuses a "["
  # preceded by a backtick, "!" or "[", so prose can quote the refused
  # shape in a code span, as the paragraph above does. The
  # second reads a link reference definition, `[label]: page.md`, which
  # carries no "(" -- this file's siblings write many, every one of them
  # an absolute url -- and is anchored at the start of the line, because
  # a reference *use* followed by a colon is ordinary prose and an
  # unanchored pattern reported two lines of CHANGELOG.md. What pygrep
  # cannot see is a fenced block, being line based -- an example of the
  # refused shape inside one fails this hook, and the code span is the
  # way round it
  - repo: local
    hooks:
      - id: local-link-prefix
        name: a local markdown link destination begins with ./
        language: pygrep
        # one line, and no literal space in it -- "\x20" is the space the
        # reference branch allows -- so yamllint reads the value as a
        # single unbreakable word and its 100-column rule exempts it. A
        # block scalar rather than a quoted one for the same reason a
        # folded scalar was rejected: folding joins lines with a space,
        # which would land inside the regex
        entry: |-
          (?<![`!\[])(?:!?\[(?:[^]]|\]\([^)]*\))*\]\(|^\x20{0,3}\[[^]]+\]:\s*)(?!\./|#|[A-Za-z][A-Za-z0-9+.-]*:)[^)\s]
        types: [markdown]
      # a line that ends inside a word, at that word's own hyphen.
      # Section 4 of the organization standard is the rule: what such a
      # line renders as, why nothing else here catches it, what this
      # pattern cannot see, and what the measurement was before it was
      # proposed
      - id: no-hyphen-at-end-of-line
        name: a word is not wrapped at its own hyphen
        language: pygrep
        entry: "[A-Za-z0-9]-$"
        types: [markdown]
  # what ruff-format is for Python, on the structured files ruff does not
  # read: yaml, and the jsonc that carries a comment. Before yamllint below,
  # so the linter judges the formatted file and not the one that was typed.
  #
  # Not the archived pre-commit/mirrors-prettier, which stopped at prettier
  # 2. The default configuration and no .prettierrc: what this tree already
  # writes is what prettier writes, the exception being an inline sequence
  # long enough to be exploded, and a block sequence -- which prettier
  # leaves alone -- is the spelling that keeps one entry per line whatever
  # the width.
  #
  # `files` is an allow list and not an exclude, because prettier reads more
  # than it should be given here. markdown is markdownlint's, whose config
  # settles the styles prettier would also have an opinion about;
  # .secrets.baseline is detect-secrets' own output. What is in scope is the
  # yaml, `.vscode` and .markdownlint.jsonc, and prettier is also what
  # parses the last two -- check-json cannot read a comment
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: prettier (yaml and jsonc, in place fixes)
        files: ^(.*\.ya?ml|\.vscode/.*\.json|\.markdownlint\.jsonc)$
  # the same for toml, which here is pyproject.toml and
  # results/machine.toml: .taplo.toml holds the formatting choices and the
  # reasoning for them, as .yamllint.yaml does for the width of a yaml line.
  # uv.lock is toml to identify and therefore matched by the hook's own
  # types, and it is uv's file to write. It runs before toml-comment-width
  # below, which reads a comment line and is the one thing here a formatter
  # does not settle -- taplo aligns a comment that trails a value and
  # rewraps none. taplo-lint is not enabled beside this: it validates
  # against a schema catalogue it fetches, and pyroma and check-sdist
  # below read the metadata offline
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: taplo (toml, in place fixes)
        exclude: ^uv\.lock$
  # the shape of a yaml file, which nothing else here reads: the hook
  # above holds markdown to 80 columns and ruff holds Python comments and
  # docstrings to the same, and the workflows were a place prose could
  # grow without a limit -- 117 columns at the worst. Toml was the other,
  # and the hook below is what closed it. Width is the half of this a
  # sibling gate could in principle have covered; a key written twice, a
  # block indented under nothing, a value that is octal by accident are
  # read by nothing else at all.
  # Configured in .yamllint.yaml rather than in args here, as codespell
  # and typos are configured in pyproject.toml: the default set, the two
  # rules left off, and a width that is not 80 need a paragraph each.
  # No args, and the hook declares none either, so there is nothing here
  # to drop by omission -- unlike zizmor below
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (the default rule set, less two)
  # the width of a toml comment, which was the last prose here held to
  # nothing. pyproject.toml carries more reasoning than any single file
  # the rules above cover, and one of its comments had reached 118
  # columns -- found by reading, which is the only thing that was
  # looking.
  # A local pygrep rule because nothing off the shelf does it: taplo
  # formats values and leaves comments alone, by design, a formatter that
  # reflowed prose being a formatter that rewrites it.
  # `.{80}\S*[ \t]` reports a line only when whitespace is left past
  # column 80, which is MD013's amnesty and ruff's: a comment ending in a
  # link that cannot be broken is not a defect, and every Python comment
  # here over 80 columns is exactly that. Without the amnesty this would
  # be stricter on toml prose than the rules it mirrors are on the same
  # sentences in a .py or a .md.
  # The `#` after optional indent selects a comment and not a long value:
  # `addopts` and `skip` in pyproject.toml are single tokens no width can
  # break, and a value is not prose.
  # pygrep matches bytes, so a non-ascii character would count as its
  # utf-8 length. Every toml file here is ascii today, and the error is
  # in the safe direction anyway -- a line reported one column early is
  # rewrapped, never a line silently let through
  - repo: local
    hooks:
      - id: toml-comment-width
        name: toml comment width (80 columns, unbreakable links exempt)
        language: pygrep
        entry: '^(?=[ \t]*#).{80}\S*[ \t]'
        files: \.toml$
  # .github/dependabot.yml is validated by nothing else here: check-yaml
  # above asks whether it is yaml, and actionlint below reads workflows
  # and not this. A typo in a package-ecosystem or a directory is not an
  # error to GitHub -- it silently updates nothing, and the evidence is a
  # pull request that never arrives. That file is the whole of the answer
  # to issue #158, both ecosystems reaching the default branch as a pull
  # request, so "it stopped running and said nothing" is exactly the
  # failure to guard against.
  # check-github-workflows is not added beside it: actionlint already
  # reads every workflow and goes further than the schema does, into
  # expressions, contexts and runner labels
  # .readthedocs.yaml is the same argument again: a file that check-yaml
  # reads as yaml and nothing reads as a build definition, on a service
  # whose failure mode is a docs build that stops happening
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-readthedocs
  # the workflows carry expressions and logic no schema reads, and
  # nothing else here validated them: an unknown key, a typo in a
  # context reference, an action input that does not exist, a job
  # depending on a job that is not there are all things a run discovers
  # by failing.
  # The Python packaging of actionlint rather than the upstream hook, whose
  # only non-docker id is language: golang, i.e. a go toolchain on every
  # machine that commits and on pre-commit.ci
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    # not below actionlint 1.7.7: its list of runner labels is compiled
    # in, and versions before it do not know ubuntu-24.04-arm, which
    # os-ubuntu.yml runs on
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        name: actionlint (github workflows)
        # actionlint delegates the body of a run: step to shellcheck, and
        # of a "shell: python" step to pyflakes, if it finds them on the
        # PATH: without them it validates the yaml around a shell script
        # and not the script. Declared here rather than installed by hand,
        # so that every machine and pre-commit.ci check what CI checks --
        # the runner image happens to carry shellcheck, so leaving it to
        # chance meant CI checking more than a commit did.
        # Pinned, because nothing bumps an additional dependency:
        # pre-commit.ci moves rev, dependabot has no pre-commit ecosystem.
        # That is the point rather than the cost -- a shellcheck release
        # adding a check would otherwise turn a pull request red for having
        # changed nothing
        additional_dependencies:
          - shellcheck-py==0.11.0.1
          - pyflakes==3.4.0
  # actionlint asks whether a workflow is correct, zizmor whether it is
  # safe: a token persisted where a later step can read it, a cache
  # restored into the job that builds what gets published, an expression
  # interpolated into a shell script, a trigger that runs a fork's code
  # with write access. The default persona is the gate; --persona=auditor
  # adds advice, none of it a defect -- today concentrated in
  # claude-review.yml, a secret read outside a dedicated environment and
  # a job short a concurrency limit or a documented permission, with one
  # further note in test.yml -- and is worth running by hand rather than
  # on every commit
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # offline is what it does by default, said out loud: it warns about
        # the implicit choice on every run, and the choice is the right one.
        # Two audits can query GitHub for the actions a workflow pins --
        # impostor-commit and known-vulnerable-actions -- which would make
        # the hook want a token and report differently on a machine that
        # has none. Those two therefore stay unrun, here and in CI.
        # --no-progress is repeated rather than added: args replaces what
        # the hook declares, and that flag is the whole of what it declares,
        # so passing --offline alone would drop it. Measured here, piping the
        # output, the two are byte for byte identical: zizmor sees there is
        # no terminal. The hook declares it for the environment where that
        # detection fails and the progress bar lands in the log, which is
        # pre-commit.ci (zizmor issue 582) -- not reproducible from here,
        # and not a reason to drop a flag its author put there
        args: [--offline, --no-progress]
  # ruff replaces autoflake, bandit, black, copyright_notice_precommit,
  # docformatter, flake8, isort, pydocstringformatter, pydocstyle, pylint,
  # pyupgrade, and yesqa
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        name: ruff check (in place fixes)
        args: [--fix]
      - id: ruff-format
        name: ruff format (in place fixes)
  # ruff's D family checks that a docstring exists, and this checks that it
  # describes the arguments and the return value the signature declares --
  # the half that goes wrong in silence when a signature changes and the
  # prose under it does not. The configuration is in pyproject.toml, next
  # to the ruff one.
  #
  # Scoped to `scripts/`, which is where every function this repository
  # writes lives: the six benchmarks included, a fixture builder whose
  # docstring no longer matches its parameters being how a row starts
  # measuring something other than what the page says it does. Not
  # `tests/`, where mypy does run: a test takes fixtures rather than
  # arguments and has no caller to hold a contract with, so the sections
  # this asks for would be written for nobody
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint
        name: pydoclint (arguments and return values)
        args: [--config=pyproject.toml]
        files: ^scripts/.*\.py$
  # the other half of pyproject.toml's unspecified-encoding, which reads
  # `open` and the pathlib and tempfile spellings and stops there. A child
  # process decoded through `text=True` takes the locale's encoding by
  # exactly the same rule -- what a test asserts then depends on what
  # Windows decoded the child's stdout as -- and no linter here has an
  # opinion on that keyword.
  # `encoding=` is what the call wanted anyway: passing it puts subprocess
  # in text mode, so the fix is one keyword in place of another and never
  # a mode change.
  # A literal keyword rather than a call-shaped pattern, because pygrep is
  # line based and every such call here spans several lines. It costs
  # nothing to be that blunt: there is no reason to write `text=True` that
  # `encoding="utf-8"` does not answer
  - repo: local
    hooks:
      - id: decoded-subprocess-encoding
        name: a decoded subprocess names its encoding, not text=True
        language: pygrep
        entry: '\b(text|universal_newlines)=True'
        files: \.py$
  # not the mirrors-mypy hook: it injects --ignore-missing-imports, which
  # turns an unresolved (or misspelled) import into Any, the opposite of
  # strict, and it type checks in an isolated environment, where every
  # import of the btclib_secp256k1 bindings is exactly that. Declaring
  # them there would pin the bindings a second time, in additional
  # dependencies beside uv.lock and by hand, so the hook could type check
  # against a version the suite never ran. This is the very command the
  # lint workflow runs, against the project environment and the real
  # pytest.
  # --locked, as everywhere else, and not --frozen, which takes uv.lock
  # as it finds it: a dependency added to pyproject.toml without a re-lock
  # leaves mypy type checking a stale environment and saying nothing about
  # it. The uv-lock hook below catches the stale lock in the same run, but
  # only after this one has already produced a verdict on the wrong
  # environment, and the lint workflow runs this file, so CI inherits that.
  # .github/scripts is in the scope because what lives there imports btclib
  # and no test collects it: the smoke script needs a node, so a workflow
  # dispatch is the only thing that runs it, and strict mode is the whole of
  # what reads it in between. A bound method used as a truth value is what
  # that buys -- in a script of checks, a check that cannot fail.
  # scripts/ joins it for the same reason: no test collects either script
  # there, a manual run being the whole of what exercises benchmark.py and
  # benchmark_libraries.py alike. The latter imports five untyped
  # third-party packages the `bench` group installs and this command's
  # `--group lint --group test` does not, so pyproject.toml's
  # [[tool.mypy.overrides]] declares ignore_missing_imports for exactly
  # those five -- unresolved either way, with or without the group, so the
  # group is not what this command needs. The former has no third-party
  # dependency to begin with, so nothing there needs that override
  - repo: local
    hooks:
      # `render.py --check` says a published page still matches the run it
      # claims to publish, and it is the whole of what holds `_results.py`
      # and `render.py` honest -- the stated reason both sit outside the
      # coverage gate. It was in CONTRIBUTING.md and in no gate, so the one
      # thing standing between a page and the numbers it claims was whoever
      # remembered to type it.
      #
      # Here rather than in a workflow because the lint workflow runs this
      # very file: one entry gates a commit and CI at once.
      #
      # `--check` and never the write. Rendering in CI would be the coupling
      # the split between measuring and publishing exists to remove, a
      # heading's rewording put behind a machine. This reads a JSON file and
      # a markdown file per script under results/, imports no benchmark,
      # compiles no comparand, takes no measurement and writes nothing --
      # the same category as asking a formatter whether the file it would
      # write is the file that is there, which several hooks above already
      # are.
      #
      # `language: python` with no dependencies because it needs none:
      # `render.py`, `_results.py` and `_provenance.py` are stdlib only. So
      # it runs on pre-commit.ci as well, where `uv` is absent and `mypy` is
      # skipped for exactly that reason.
      #
      # `always_run` rather than a `files` pattern: a page goes stale from an
      # edit to its markdown, to its saved run, or to the renderer, and a
      # pattern narrow enough to name those is a pattern that stops matching
      # one day -- which is the hazard the top of this file is about.
      - id: render-check
        name: render.py --check (each page matches its saved run)
        entry: python scripts/render.py --check
        language: python
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy (strict, in the project environment)
        entry: >
          uv run --locked --no-default-groups --group lint --group test
          mypy --explicit-package-bases scripts tests
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      # keep uv.lock in sync with pyproject.toml
      - id: uv-lock
  # what is tracked and not in the sdist, and what is in the sdist and not
  # tracked, both ways round, against the patterns of
  # [tool.uv.build-backend]. Nothing is configured here: the hook's own
  # manifest already passes --no-isolation and --inject-junk and installs
  # uv, which is the whole of what this needs. --no-isolation is what
  # pre-commit.ci requires -- an isolated build environment cannot be
  # created there (no ensurepip in the interpreter, read-only virtualenv
  # app data) -- and it costs nothing to build without one, the backend
  # being the copy bundled in that uv. --inject-junk drops a cache
  # directory and an egg-info beside the sources for the length of the
  # run, which is what the exclusions in [tool.uv.build-backend] answer
  - repo: https://github.com/henryiii/check-sdist
    rev: v1.6.0
    hooks:
      - id: check-sdist
  - repo: https://github.com/regebro/pyroma
    # the newest *stable* tag: 5.1b1 and 5.1b2 sit above it, and
    # `pre-commit autoupdate` offers a prerelease as readily as a
    # release, having no notion of one -- the bitcoin-core-rpc incident
    # above is exactly this failure mode, pyroma included. What a beta
    # of the packaging checker would gate is the release workflow, on a
    # judgement its own author has not settled yet
    rev: "5.0.1"
    hooks:
      - id: pyroma
        # the backend, in pyroma's own environment, because pyroma builds
        # this project to read its metadata and its command line has no
        # way to say how. It asks `build` for the metadata without
        # isolation first and falls back to an isolated build when that
        # raises, and an isolated build is a virtual environment
        # pre-commit.ci cannot create -- the interpreter there has no
        # ensurepip, which is the same constraint the check-sdist hook
        # above answers with --no-isolation. Under setuptools the first
        # attempt always won for a reason that had nothing to do with
        # this project: setuptools>=61 is a dependency of pyroma, so the
        # backend was already importable. uv_build is not, so without
        # this line the fallback is taken and pre-commit.ci goes red
        # while every local run stays green.
        #
        # The specifier is [build-system]'s, and has to stay it: `build`
        # skips isolation only when the environment satisfies what
        # pyproject.toml requires, so a version here outside that range
        # puts the fallback back. Not pinned, unlike the additional
        # dependencies above: what this has to match is a range rather
        # than a release, and the isolated build it replaces would have
        # resolved the same range itself
        additional_dependencies: ["uv_build>=0.12.5,<0.13"]
